":[{"materialId":"m21","amount":5,"unit":"g","equivalents":1,"limitingReagent":true,"role":"substrate (limiting reagent; isolated in Step A)","rawText":"dibenzo[b,d]thiophene 5-oxide 1 (5.0 g, 25.0 mmol, 1.0 equiv)"},{"materialId":"m14","amount":150,"unit":"mL","role":"reaction solvent","rawText":"dry DCM (150 mL)"}],"inputIds":["sp1"],"dependsOn":["s4"],"parameters":[{"type":"mass","value":5,"unit":"g","formula":"n = m/M = 5.0 g / 200.26 g/mol = 25.0 mmol","rawText":"dibenzo[b,d]thiophene 5-oxide 1 (5.0 g, 25.0 mmol, 1.0 equiv)"},{"type":"amountOfSubstance","value":25,"unit":"mmol","formula":"n = m/M = 5.0 g / 200.26 g/mol","rawText":"25.0 mmol, 1.0 equiv"},{"type":"volume","value":150,"unit":"mL","rawText":"dry DCM (150 mL)"},{"type":"temperature","value":-50,"comparator":"approx","unit":"degC","rawText":"cooled to -50 C (internal temperature)"}],"expectedResult":"Clear cold solution of 1 in DCM.","criticalNotes":"Uses intermediate 1 from Step A (sample sp1); rigorously anhydrous conditions required.","sourceReferences":[{"sourceId":"src1","page":260,"excerpt":"dibenzo[b,d]thiophene 5-oxide 1 (5.0 g, 25.0 mmol, 1.0 equiv)"}]},{"id":"s10","number":10,"phase":"C. Coupling to thiophenium triflate 3","action":"Add triflic anhydride slowly over 5 min by syringe pump, forming an intense orange/red suspension. Stir 45 min at -50 C.","equipmentIds":["e2","e5"],"materialUses":[{"materialId":"m15","amount":4.2,"unit":"mL","equivalents":1,"role":"activator (sulfoxide activation)","rawText":"Triflic anhydride (4.20 mL, 25.0 mmol, 1.0 equiv)"}],"parameters":[{"type":"volume","value":4.2,"unit":"mL","rawText":"Triflic anhydride (4.20 mL, 25.0 mmol, 1.0 equiv)"},{"type":"amountOfSubstance","value":25,"unit":"mmol","formula":"n = V x rho / M = 4.20 mL x ~1.677 g/mL / 282.13 g/mol = 25.0 mmol","rawText":"25.0 mmol, 1.0 equiv"},{"type":"time","value":5,"unit":"min","rawText":"added over 5 min by syringe pump"},{"type":"time","value":45,"unit":"min","rawText":"stirred for 45 min"},{"type":"temperature","value":-50,"comparator":"approx","unit":"degC","rawText":"at -50 C"}],"expectedResult":"Intense orange/red suspension (activated sulfoxide).","safetyNotes":"Tf2O is corrosive, moisture-sensitive and a lachrymator; add under N2.","sourceReferences":[{"sourceId":"src1","page":260}]},{"id":"s11","number":11,"phase":"C. Coupling to thiophenium triflate 3","action":"Add a solution of alkyne 2 in dry DCM over 5 min by syringe pump. Warm to -15 C over 1 h (the suspension becomes a clear light-brown solution) and stir at -15 C under N2 for 12 h. Monitor by TLC.","equipmentIds":["e2","e5","e9"],"materialUses":[{"materialId":"m22","amount":7.9,"unit":"mL","equivalents":1,"role":"alkyne-transfer reagent (isolated in Step B)","rawText":"alkyne 2 (7.90 mL, 25.0 mmol, 1.0 equiv)"},{"materialId":"m14","amount":10,"unit":"mL","role":"co-solvent (to dissolve alkyne 2)","rawText":"alkyne 2 ... in dry DCM (10 mL)"}],"inputIds":["sp2"],"dependsOn":["s8"],"parameters":[{"type":"volume","value":7.9,"unit":"mL","rawText":"alkyne 2 (7.90 mL, 25.0 mmol, 1.0 equiv)"},{"type":"amountOfSubstance","value":25,"unit":"mmol","formula":"n = V x rho / M = 7.90 mL x ~0.81 g/mL / 254.56 g/mol = 25.0 mmol","rawText":"25.0 mmol, 1.0 equiv"},{"type":"volume","value":10,"unit":"mL","rawText":"in dry DCM (10 mL)"},{"type":"time","value":5,"unit":"min","rawText":"added ... over 5 min by syringe pump"},{"type":"temperature","value":-15,"comparator":"approx","unit":"degC","rawText":"allowed to warm to -15 C over one hour"},{"type":"time","value":1,"unit":"h","rawText":"over one hour"},{"type":"time","value":12,"unit":"h","rawText":"stirred at this temperature under N2 for another 12 h"}],"acceptanceCriteria":[{"parameter":"TLC monitoring (20% acetone in CH2Cl2, UV 254 nm)","classification":"product (salt 3) Rf 0.34; starting material Rf 0.72","description":"Endpoint: conversion to the product spot at Rf 0.34."}],"expectedResult":"Clear light-brown solution; TLC shows conversion to product (Rf 0.34).","sourceReferences":[{"sourceId":"src1","page":260}]},{"id":"s12","number":12,"phase":"C. Coupling to thiophenium triflate 3","action":"Quench with methanol. Transfer to a 500 mL flask, add silica gel, and concentrate to dryness to adsorb the crude product onto silica.","equipmentIds":["e6"],"materialUses":[{"materialId":"m16","amount":5,"unit":"mL","role":"quench","rawText":"quenched by addition of methanol (5 mL)"},{"materialId":"m17","amount":50,"unit":"mL","role":"adsorbent (dry-load)","rawText":"Silica gel (50 mL) is added"}],"parameters":[{"type":"volume","value":5,"unit":"mL","rawText":"quenched by addition of methanol (5 mL)"},{"type":"volume","value":50,"unit":"mL","rawText":"Silica gel (50 mL) is added"}],"expectedResult":"Crude 3 dry-adsorbed on silica gel."},{"id":"s13","number":13,"phase":"C. Coupling to thiophenium triflate 3","action":"Dry-load onto a packed silica column (95 g, 16.0 x 6.0 cm, sand cap). Elute first with DCM (discard) then with DCM:acetone 4:1, collecting fractions.","equipmentIds":["e8","e9"],"materialUses":[{"materialId":"m17","amount":95,"unit":"g","role":"stationary phase","rawText":"95 g silica gel, 16.0 x 6.0 cm"},{"materialId":"m14","amount":500,"unit":"mL","role":"eluent (first pass, discarded)","rawText":"eluted first with DCM (500 mL)"},{"materialId":"m14","amount":1600,"unit":"mL","role":"eluent (DCM component of the 4:1 mixture)","rawText":"DCM:acetone mixture, 4:1 (2 L)"},{"materialId":"m18","amount":400,"unit":"mL","role":"eluent (acetone component of the 4:1 mixture)","rawText":"DCM:acetone mixture, 4:1 (2 L)"}],"parameters":[{"type":"mass","value":95,"unit":"g","rawText":"95 g silica gel, 16.0 x 6.0 cm"},{"type":"volume","value":500,"unit":"mL","rawText":"eluted first with DCM (500 mL)"},{"type":"ratio","value":4,"unit":":1","rawText":"DCM:acetone mixture, 4:1"},{"type":"volume","value":2,"unit":"L","formula":"4:1 of 2 L total = 1600 mL DCM + 400 mL acetone","rawText":"DCM:acetone mixture, 4:1 (2 L)"}],"expectedResult":"Product-containing fractions (by TLC); first 500 mL DCM fraction discarded.","criticalNotes":"By-products are non-polar or near baseline; large fractions may be collected."},{"id":"s14","number":14,"phase":"C. Coupling to thiophenium triflate 3","pausePoint":true,"action":"Partially evaporate the product fractions to ~15 mL. Add Et2O slowly over 5 min to precipitate 3 as a white microcrystalline powder; cool to 0 C, filter, and wash with Et2O to afford pure 3.","equipmentIds":["e6","e3"],"materialUses":[{"materialId":"m19","amount":100,"unit":"mL","role":"precipitation (anti-solvent)","rawText":"Slow addition of Et2O (100 mL) over 5 min"},{"materialId":"m19","amount":50,"unit":"mL","role":"wash","rawText":"washed with Et2O (50 mL)"}],"outputIds":["sp3"],"parameters":[{"type":"temperature","value":40,"unit":"degC","rawText":"solvent partially evaporated (40 C, 600 to 375 mmHg)"},{"type":"pressure","value":375,"valueMax":600,"comparator":"range","unit":"mmHg","rawText":"600 to 375 mmHg"},{"type":"volume","value":15,"unit":"mL","rawText":"approximately 15 mL"},{"type":"volume","value":100,"unit":"mL","rawText":"Et2O (100 mL)"},{"type":"time","value":5,"unit":"min","rawText":"over 5 min"},{"type":"temperature","value":0,"unit":"degC","rawText":"cooled to 0 C in an ice bath"},{"type":"volume","value":50,"unit":"mL","rawText":"washed with Et2O (50 mL)"},{"type":"mass","value":7.5,"unit":"g","rawText":"7.50 g"}],"acceptanceCriteria":[{"parameter":"isolated yield","comparator":"approx","value":58,"unit":"%","description":"7.50 g of 3 as a white microcrystalline powder (reference run)."},{"parameter":"purity (QNMR vs 1,3,5-trimethoxybenzene, m20)","comparator":"min","value":98,"unit":"wt%","description":"Reference run achieved 98 wt%."},{"parameter":"melting point","comparator":"approx","value":155,"unit":"degC","description":"mp 155 C (with decomposition); energetic solid."}],"expectedResult":"3 as a white microcrystalline powder: 7.50 g, 58% yield, 98 wt% purity; mp 155 C (dec).","criticalNotes":"3 is energetic (>600 J/g on decomposition above 155 C). Do not heat the solid above 100 C; evaluate any heating of multigram quantities above 80 C by isothermal DSC.","safetyNotes":"Energetic solid; store cool, avoid heat and mechanical/thermal stress.","sourceReferences":[{"sourceId":"src1","page":261,"excerpt":"afford pure 3 (7.50 g, 58% yield, 98 wt% purity)"}]}],"expectedOutputs":["Step A: Dibenzo[b,d]thiophene-5-oxide (1) as white needles, 9.03 g, 81% yield, 97 wt% purity, mp 188 C.","Step B: Triisopropyl((trimethylsilyl)ethynyl)silane (2) as a colorless oil, 7.42 g, 95% yield, 99 wt% purity.","Step C: 5-(Triisopropylalkynyl)dibenzo[b,d]thiophenium triflate (3) as a white microcrystalline powder, 7.50 g, 58% yield, 98 wt% purity, mp 155 C (dec).","Characterization data (1H/13C/19F NMR, IR, HRMS) consistent with each structure."],"troubleshooting":[{"problem":"Sulfone over-oxidation by-product in Step A","cause":"Internal temperature allowed to exceed 40 C during H2O2 addition","solution":"Keep internal T below 30 C and quench promptly once SM is consumed; if formed, purify 1 by flash chromatography (DCM/MeOH 50:1 -> 25:1) rather than recrystallization."},{"problem":"Delayed runaway exotherm in Step A","cause":"Reaction run cold (e.g. 0 C) so oxidation is slow with delayed onset","solution":"Run at 20-25 C with internal-T monitoring and 2 h peroxide addition; test for onset by adding a small peroxide portion and watching for a T rise."},{"problem":"Poor TLC resolution in Step A monitoring","cause":"Spotting the TFA solution directly","solution":"Dilute an aliquot with ethyl acetate / saturated aqueous NaHCO3 and spot the organic layer."},{"problem":"Low recovery of 3 from chromatography","cause":"Product co-eluting or lost in the early DCM fraction","solution":"Discard the first 500 mL DCM fraction; collect and TLC 100-200 mL fractions of the 4:1 DCM:acetone eluent."}],"safety":["Carry out a full hazard/risk assessment for every substance and operation before starting (see Prudent Practices in the Laboratory, Ch. 4).","Step A H2O2/TFA oxidation is highly exothermic with possible delayed runaway if run cold; use internal-temperature monitoring and add peroxide over 2 h via PTFE tubing (no metal contact).","n-BuLi is pyrophoric; Tf2O and TIPSCl are moisture-sensitive and corrosive; TMS-acetylene, THF, MTBE and Et2O are highly flammable; DCM is a suspected carcinogen. Use inert atmosphere and a fume hood.","Product 3 is an energetic solid (>600 J/g on decomposition above 155 C). Do not heat the solid above 100 C; evaluate any heating of multigram quantities above 80 C by isothermal DSC. Drop-weight testing (3 x 30 J) showed no impact sensitivity."],"biosafetyLevel":"not specified","compliance":{"wasteDisposal":"Collect halogenated (DCM) and non-halogenated organic solvent waste separately. Cautiously quench pyrophoric n-BuLi residues and excess Tf2O/TIPSCl before disposal. Treat product 3 residues as thermally sensitive/energetic.","notes":"No animal or human subjects. A documented chemical-hazard risk assessment is required per institutional rules before starting."},"limitations":"Bench-scale procedure; larger scales of the Step A oxidation may require added cooling and slower peroxide addition due to reduced surface-area-to-volume ratio. GHS hazard codes are not provided in the source and are marked needsReview where supplemented. The CAS number of the isolated alkyne 2 (m22) is not confirmed. Molar amounts derived via the formula fields use approximate reagent densities (flagged with '~'); the mmol/equivalents themselves are taken verbatim from the source. Product 3 is thermally sensitive and not suitable for high-temperature storage or use.","sources":[{"id":"src1","kind":"article","title":"Preparation of 5-(Triisopropylalkynyl)dibenzo[b,d]thiophenium Triflate (Waldecker, Kafuta, Alcarazo, Org. Synth. 2019, 96, 258-276)","doi":"10.15227/orgsyn.096.0258","url":"http://orgsyn.org/Content/pdfs/procedures/v96p0258.pdf","license":"Organic Syntheses (freely accessible; reuse per publisher terms)","licenseVerified":false},{"id":"src2","kind":"book","title":"Prudent Practices in the Laboratory: Handling and Management of Chemical Hazards (National Research Council, updated version 2011)","license":"Cited for hazard/risk-assessment guidance; not reproduced","licenseVerified":false}],"provenance":{"versionId":"lr-v03-organic-synthesis@0.3-demo","derivedFromVersionId":"lr-stress-organic-synthesis@0.2","library":"public","owner":"LabRecord","status":"draft"}}},{"id":"pk-animal-study","label":"PK animal study (in-vivo)","group":"v0.3 cross-discipline","data":{"schemaVersion":"0.3","metadata":{"title":"Rodent single-dose pharmacokinetics with serial blood sampling (IV vs PO, v0.3 in-vivo demo)","protocolId":"lr-v03-pk-animal-study","version":"0.3-demo","family":"Pharmacokinetics","category":"In vivo / DMPK","discipline":"Pharmacology","purpose":"Determine the plasma pharmacokinetic profile and absolute oral bioavailability of a small-molecule test compound in mice after a single intravenous bolus and a single oral dose, using serial blood sampling from the same animals and LC-MS/MS bioanalysis.","scope":"Small-molecule plasma PK in mouse after one IV bolus and one PO gavage dose, with serial lateral-saphenous-vein sampling (no anesthesia). Demonstrates v0.3 in-vivo constructs (studyDesign, compliance, organism samples, step.repeat, acceptanceCriteria). Out of scope: tissue distribution, metabolite ID, multi-dose/steady-state, and large-molecule PK.","estimatedTime":"1 dosing day (~4 h sampling window) + LC-MS/MS bioanalysis and NCA (2-3 days)","beforeYouBegin":["Record the IACUC approval / protocol number in the study file BEFORE any animal work; this study must not start without it (see compliance.iacuc).","Randomize animals to the IV or PO arm by a documented method and record the allocation before dosing (see studyDesign.randomization).","Compute each animal's dose (from body weight) and its maximum cumulative blood-withdrawal cap (~10% of total blood volume) before sampling (table t3).","Decide and record fasting status for the PO arm; it is not fixed by the methods sources (needsReview).","Prepare formulations so the dose fits within route volume limits: IV \u003c=5 mL/kg, PO \u003c=10 mL/kg (Diehl 2001, src2).","Confirm the LC-MS/MS method (internal standard, extraction, calibration range, QC acceptance) is validated for the analyte before bioanalysis."],"tags":["pharmacokinetics","PK","in vivo","mouse","serial blood sampling","bioavailability","LC-MS/MS","IACUC","DMPK","NCA"]},"materials":[{"id":"m1","name":"Test compound","role":"reagent","specification":"Small-molecule test article; identity, purity, salt form and lot recorded per study","needsReview":true},{"id":"m2","name":"IV dosing formulation","role":"solvent","workingConcentration":"concentration set so the target IV dose is delivered within \u003c=5 mL/kg","specification":"Solution/fine suspension suitable for IV bolus (e.g. saline +/- co-solvent); exact vehicle is compound-specific","rawText":"single intravenous bolus","needsReview":true},{"id":"m3","name":"PO dosing formulation","role":"solvent","workingConcentration":"concentration set so the target PO dose is delivered within \u003c=10 mL/kg","specification":"Oral vehicle/suspension; exact vehicle is compound-specific","rawText":"single oral dose (gavage)","needsReview":true},{"id":"m4","name":"Anticoagulant (K2-EDTA)","role":"reagent","specification":"Coating of blood-collection tubes for plasma; anticoagulant choice per bioanalytical method","needsReview":true},{"id":"m5","name":"Blank (analyte-free) mouse plasma","role":"standard","specification":"Drug-free matrix for LC-MS/MS calibration standards and QC samples"},{"id":"m6","name":"LC-MS/MS internal standard","role":"standard","specification":"Stable-isotope-labeled or close structural analog; identity per validated method","needsReview":true},{"id":"m7","name":"Protein-precipitation solvent (acetonitrile, containing internal standard)","role":"solvent","specification":"For plasma extraction prior to LC-MS/MS; exact solvent/ratio per method","hazard":"Flammable organic solvent; handle per SDS","needsReview":true}],"equipment":[{"id":"e1","name":"Animal balance / scale","settings":"Weigh each animal to compute per-animal dose and blood-withdrawal cap","rawText":"weigh each animal"},{"id":"e2","name":"IV tail-vein injection setup","model":"Rodent restrainer + fine (e.g. 27-30 G) needle","settings":"Single slow IV bolus into a lateral tail vein at t=0","needsReview":true},{"id":"e3","name":"Oral gavage setup","model":"Ball-tipped rodent feeding needle/cannula","settings":"Single PO gavage at t=0","needsReview":true},{"id":"e4","name":"Lateral-saphenous serial-sampling supplies","settings":"Needle prick of the lateral saphenous vein; collect drop into K2-EDTA capillary/microvette; no anesthesia (Peng 2009)","rawText":"serial blood sampling using the lateral saphenous vein puncture technique","needsReview":true},{"id":"e5","name":"Refrigerated microcentrifuge","settings":"Separate plasma from blood; ~2000 x g, 10 min, 4 degC (standard; confirm per lab SOP)","needsReview":true},{"id":"e6","name":"-80 degC freezer","settings":"Store plasma until bioanalysis"},{"id":"e7","name":"LC-MS/MS system","settings":"Quantify analyte in plasma against a matrix-matched calibration curve with internal standard; instrument/method analyte-specific","needsReview":true},{"id":"e8","name":"Non-compartmental PK analysis software","settings":"Compute NCA parameters (e.g. Certara Phoenix WinNonlin); specific package per lab","needsReview":true}],"samples":[{"id":"sp1","name":"Mouse cohort - IV arm","role":"input","kind":"organism","organism":"Mus musculus (mouse), male, ~20-30 g; strain per study (e.g. CD-1)","description":"Animals randomized to the IV bolus arm (n=3); each animal is serially sampled across all timepoints. Sex 'male' per Peng 2009 (src1); strain is a study choice (needsReview).","needsReview":true},{"id":"sp2","name":"Mouse cohort - PO arm","role":"input","kind":"organism","organism":"Mus musculus (mouse), male, ~20-30 g; strain per study (e.g. CD-1)","description":"Animals randomized to the oral gavage arm (n=3); each animal is serially sampled across all timepoints.","needsReview":true},{"id":"sp3","name":"Whole-blood serial samples","role":"intermediate","kind":"physical","description":"Timed whole-blood microsamples drawn from the same animal at each scheduled timepoint into K2-EDTA tubes."},{"id":"sp4","name":"Plasma samples","role":"intermediate","kind":"physical","description":"Plasma separated from each blood draw by centrifugation; analyte quantified by LC-MS/MS."},{"id":"sp5","name":"Plasma concentration-time dataset","role":"intermediate","kind":"dataset","dataType":"table (analyte concentration vs time, per animal/arm)","description":"Per-timepoint plasma concentrations feeding non-compartmental analysis."},{"id":"sp6","name":"NCA PK parameter set","role":"output","kind":"dataset","dataType":"table (Cmax, Tmax, AUC, t1/2, CL, Vss, F%)","description":"Derived non-compartmental PK parameters per arm plus absolute oral bioavailability."}],"containers":[{"id":"c1","name":"K2-EDTA capillary / microtainer blood tubes","type":"tube","wells":null},{"id":"c2","name":"Plasma storage cryovials","type":"tube","wells":null},{"id":"c3","name":"LC-MS/MS autosampler plate","type":"plate","wells":96,"needsReview":true}],"tables":[{"id":"t1","title":"Serial blood-sampling schedule (same animal, both arms)","kind":"program","columns":["Timepoint","Nominal draw volume (uL)","Cumulative per animal (uL, 25 g mouse)","Note"],"rows":[["0 min (predose)",20,20,"Baseline; confirms no pre-dose analyte"],["5 min",20,40,"IV early-phase point"],["15 min",20,60,null],["30 min",20,80,null],["60 min",20,100,null],["120 min",20,120,null],["240 min",20,140,"Terminal-phase point for lambda_z"]],"note":"Seven serial draws from the same animal via lateral saphenous vein (Peng 2009, src1). Cumulative ~140 uL stays within the ~180 uL (10% total blood volume) cap for a 25 g mouse (table t3). Per-draw 20 uL is chosen to satisfy the welfare cap and the assay's required plasma volume; exact value is analyte/assay-specific (needsReview)."},{"id":"t2","title":"Non-compartmental PK parameters to derive (per arm)","kind":"other","columns":["Parameter","Definition / formula","Applies to"],"rows":[["Cmax","Maximum observed plasma concentration","IV, PO"],["Tmax","Time of Cmax","PO"],["AUC0-t","Area under the curve to last measurable point (linear-up/log-down trapezoidal)","IV, PO"],["AUC0-inf","AUC extrapolated to infinity","IV, PO"],["lambda_z","Terminal rate constant (log-linear regression of terminal points)","IV, PO"],["t1/2","ln(2) / lambda_z","IV, PO"],["CL","Dose_IV / AUC0-inf_IV","IV"],["Vss / Vz","Volume of distribution (steady-state / terminal)","IV"],["F (%)","(AUC0-inf_PO x Dose_IV) / (AUC0-inf_IV x Dose_PO) x 100","PO vs IV"]],"note":"Derived quantities. Formulas are recorded here and echoed as parameter.formula on step s8. Summaries reported mean +/- SD, n=3 per arm."},{"id":"t3","title":"Welfare blood-withdrawal limits (serial sampling)","kind":"other","columns":["Species","Total blood volume","Single-draw / recovery guidance","Serial-study cap used here"],"rows":[["Mouse","~72 mL/kg (range 63-80)","\u003c=10% of total blood volume per single draw with ~2-3 week recovery","Keep cumulative single-day withdrawal \u003c=10% total blood volume"]],"note":"From Diehl 2001 (src2) and Parasuraman 2010 (src3). For a same-day serial study without fluid replacement, cumulative withdrawal is capped conservatively at 10% of total blood volume; compute each animal's cap from its body weight before drawing.","needsReview":true}],"steps":[{"id":"s1","number":1,"phase":"Setup & ethics","action":"Confirm the IACUC approval is on file, enroll and randomize healthy mice to the IV or PO arm, weigh each animal, and compute its dose and cumulative blood-withdrawal cap.","equipmentIds":["e1"],"inputIds":["sp1","sp2"],"tableIds":["t3"],"parameters":[{"type":"mass","value":20,"valueMax":30,"unit":"g","comparator":"range","rawText":"body weight ~20-30 g at enrollment"}],"acceptanceCriteria":[{"parameter":"body weight","comparator":"range","value":20,"valueMax":30,"unit":"g","classification":"Enroll only clinically healthy mice with body weight 20-30 g; exclude sick or out-of-range animals","description":"Enrollment inclusion gate before randomization and dosing."}],"expectedResult":"Documented, IACUC-approved study with per-animal weights, arm allocation, and blood-volume caps recorded.","criticalNotes":"Do not proceed without a recorded IACUC approval/protocol number (compliance.iacuc). Compute each animal's cap (~10% total blood volume; table t3) before dosing.","safetyNotes":"All in-life work only under the approved animal-ethics protocol.","sourceReferences":[{"sourceId":"src2","excerpt":"good practice guide to the administration of substances and removal of blood ... to aid in the study design process"},{"sourceId":"src3","excerpt":"Blood sample collection in small laboratory animals"}]},{"id":"s2","number":2,"phase":"Setup & ethics","action":"Prepare the IV and PO dosing formulations of the test compound at concentrations that deliver the target dose within each route's volume limit.","materialIds":["m1","m2","m3"],"inputIds":["m1"],"parameters":[{"type":"mass","value":1,"unit":"mg/kg","rawText":"IV dose 1 mg/kg (study design choice)"},{"type":"volume","value":5,"unit":"mL/kg","comparator":"max","rawText":"IV bolus \u003c=5 mL/kg (good-practice volume limit)","sourceReferences":[{"sourceId":"src2"}]},{"type":"mass","value":10,"unit":"mg/kg","rawText":"PO dose 10 mg/kg (study design choice)"},{"type":"volume","value":10,"unit":"mL/kg","comparator":"max","rawText":"PO gavage \u003c=10 mL/kg (good-practice volume limit)","sourceReferences":[{"sourceId":"src2"}]}],"expectedResult":"Two dose formulations ready and characterized (concentration, appearance/solubility).","criticalNotes":"Exact vehicle and fasting status are compound/study-specific and not fixed by the methods sources; record them. Doses (IV 1, PO 10 mg/kg) are explicit design choices, not source values.","needsReview":true},{"id":"s3","number":3,"phase":"Dosing","action":"Administer a single IV bolus of the test compound to the IV arm via a lateral tail vein; record the exact dosing time as t=0.","materialIds":["m2"],"equipmentIds":["e2"],"inputIds":["sp1"],"parameters":[{"type":"mass","value":1,"unit":"mg/kg","rawText":"1 mg/kg IV"},{"type":"volume","value":5,"unit":"mL/kg","comparator":"max","rawText":"\u003c=5 mL/kg"}],"expectedResult":"IV arm dosed; per-animal t=0 timestamp logged.","sourceReferences":[{"sourceId":"src4","excerpt":"routes of administration and factors to consider"}],"needsReview":true},{"id":"s4","number":4,"phase":"Dosing","action":"Administer a single oral gavage dose of the test compound to the PO arm; record the exact dosing time as t=0.","materialIds":["m3"],"equipmentIds":["e3"],"inputIds":["sp2"],"parameters":[{"type":"mass","value":10,"unit":"mg/kg","rawText":"10 mg/kg PO"},{"type":"volume","value":10,"unit":"mL/kg","comparator":"max","rawText":"\u003c=10 mL/kg"}],"expectedResult":"PO arm dosed; per-animal t=0 timestamp logged.","criticalNotes":"Fasting status for the PO arm is not specified by the methods sources; decide and record it (needsReview).","sourceReferences":[{"sourceId":"src4","excerpt":"routes of administration and factors to consider"}],"needsReview":true},{"id":"s5","number":5,"phase":"Serial sampling","action":"Collect serial whole-blood microsamples from the lateral saphenous vein of each animal at every scheduled post-dose timepoint (no anesthesia), into K2-EDTA tubes.","repeat":{"count":7,"over":"scheduled post-dose timepoints (0, 5, 15, 30, 60, 120, 240 min)","untilCondition":"all 7 timepoints collected, OR the per-animal cumulative withdrawal reaches the 10% total-blood-volume welfare cap (whichever comes first)","notes":"Serial design: every timepoint is drawn from the SAME animal via lateral saphenous vein puncture, requiring no anesthesia (Peng 2009)."},"materialIds":["m4"],"equipmentIds":["e4"],"containerIds":["c1"],"inputIds":["sp1","sp2"],"outputIds":["sp3"],"tableIds":["t1","t3"],"parameters":[{"type":"time","value":0,"unit":"min","rawText":"0 min (predose baseline)"},{"type":"time","value":5,"unit":"min","rawText":"5 min"},{"type":"time","value":15,"unit":"min","rawText":"15 min"},{"type":"time","value":30,"unit":"min","rawText":"30 min"},{"type":"time","value":60,"unit":"min","rawText":"60 min"},{"type":"time","value":120,"unit":"min","rawText":"120 min"},{"type":"time","value":240,"unit":"min","rawText":"240 min"},{"type":"volume","value":20,"unit":"uL","rawText":"~20 uL per serial draw (kept small so 7 draws stay within the 10% blood-volume cap; exact volume set by assay sensitivity)","needsReview":true}],"acceptanceCriteria":[{"parameter":"cumulative blood withdrawn per animal","comparator":"max","value":10,"unit":"% total blood volume","classification":"Stop serial sampling if cumulative withdrawal would exceed 10% of the animal's total blood volume","description":"Animal-welfare quality gate governing the serial-sampling loop."}],"expectedResult":"A timed concentration series (0-240 min) of whole-blood samples per animal.","criticalNotes":"Lateral-saphenous serial sampling needs no anesthesia (Peng 2009, src1). Keep cumulative withdrawal \u003c=10% total blood volume (Diehl 2001 src2; Parasuraman 2010 src3; table t3). Record the exact clock time of each draw for accurate NCA.","safetyNotes":"Use approved restraint and sampling sites; minimize distress; apply gentle hemostasis after each draw.","sourceReferences":[{"sourceId":"src1","excerpt":"serial blood sampling methodology using the lateral saphenous vein puncture technique ... without the need for anesthesia"},{"sourceId":"src3","excerpt":"Blood sample collection in small laboratory animals"}]},{"id":"s6","number":6,"phase":"Sample processing","action":"Centrifuge each blood sample to separate plasma; transfer plasma to labeled cryovials and store frozen until bioanalysis.","equipmentIds":["e5","e6"],"containerIds":["c2"],"inputIds":["sp3"],"outputIds":["sp4"],"pausePoint":true,"parameters":[{"type":"other","value":2000,"unit":"x g","rawText":"~2000 x g (standard plasma separation; confirm per SOP)","needsReview":true},{"type":"time","value":10,"unit":"min","rawText":"10 min","needsReview":true},{"type":"temperature","value":4,"unit":"degC","rawText":"4 degC during centrifugation","needsReview":true},{"type":"temperature","value":-80,"unit":"degC","rawText":"store plasma at -80 degC until analysis"}],"acceptanceCriteria":[{"parameter":"usable plasma per sample","comparator":"min","value":10,"unit":"uL","classification":"Reject visibly hemolyzed samples or those below the minimum plasma volume required by the assay","description":"Sample-quality gate before bioanalysis."}],"expectedResult":"Plasma aliquots stored at -80 degC, ready for bioanalysis.","criticalNotes":"Centrifugation settings are standard defaults; confirm against lab SOP and the minimum plasma volume the LC-MS/MS method needs.","needsReview":true},{"id":"s7","number":7,"phase":"Bioanalysis","action":"Quantify the test compound in plasma by LC-MS/MS against a matrix-matched calibration curve with internal standard, using blank plasma for standards and QCs; keep the analyst blinded to arm and timepoint via coded samples.","materialIds":["m5","m6","m7"],"equipmentIds":["e7"],"containerIds":["c3"],"inputIds":["sp4"],"outputIds":["sp5"],"acceptanceCriteria":[{"parameter":"QC accuracy (% of nominal)","comparator":"range","value":85,"valueMax":115,"unit":"% nominal","classification":"Run accepted if QCs are within +/-15% of nominal (+/-20% at the LLOQ) and at least 2/3 QC levels pass (FDA/EMA bioanalytical criteria)","description":"Bioanalytical run-acceptance gate.","onFailStepId":"s7"}],"expectedResult":"A validated plasma concentration for every sample; concentration-time dataset assembled.","criticalNotes":"Internal standard, extraction, chromatography, and calibration range are analyte-specific and must come from the validated method (needsReview).","needsReview":true},{"id":"s8","number":8,"phase":"PK / statistical analysis","action":"Perform non-compartmental analysis (NCA) on the concentration-time data to derive Cmax, Tmax, AUC0-t, AUC0-inf, lambda_z, t1/2, CL, Vss/Vz, and absolute oral bioavailability F%.","equipmentIds":["e8"],"inputIds":["sp5"],"outputIds":["sp6"],"tableIds":["t2"],"parameters":[{"type":"other","valueText":"F (absolute oral bioavailability)","formula":"F% = (AUC0-inf_PO x Dose_IV) / (AUC0-inf_IV x Dose_PO) x 100","rawText":"absolute oral bioavailability F%"},{"type":"other","valueText":"CL (systemic clearance, IV)","formula":"CL = Dose_IV / AUC0-inf_IV","rawText":"systemic clearance from the IV arm"},{"type":"other","valueText":"t1/2 (terminal half-life)","formula":"t1/2 = ln(2) / lambda_z","rawText":"terminal elimination half-life"}],"expectedResult":"Full NCA parameter set per arm plus absolute oral bioavailability, summarized as mean +/- SD (n=3 per arm).","criticalNotes":"AUC by linear-up/log-down trapezoidal; lambda_z by log-linear regression of terminal points. Specific NCA software is lab-specific (needsReview).","needsReview":true}],"controls":[{"name":"Blank (analyte-free) mouse plasma","description":"Drug-free matrix for LC-MS/MS calibration standards and QC samples."},{"name":"Predose (t=0) baseline sample","description":"Confirms absence of analyte before dosing and gives a per-animal baseline."},{"name":"IV reference arm","description":"IV data provide the 100% bioavailability reference for computing absolute F of the PO arm."},{"name":"Bioanalytical QC samples (low/mid/high)","description":"Bracket each run to confirm assay accuracy and precision.","needsReview":true}],"expectedOutputs":["Plasma concentration-time profiles for the IV and PO arms (mean +/- SD, n=3 per arm).","Non-compartmental PK parameters per arm: Cmax, Tmax, AUC0-t, AUC0-inf, t1/2, CL, Vss/Vz.","Absolute oral bioavailability F (%).","Complete regulatory/design record: IACUC number, randomization scheme, per-animal weights, doses, and cumulative blood-volume log."],"troubleshooting":[{"problem":"Poor terminal-phase fit / unreliable lambda_z","cause":"Too few late timepoints or concentrations near the LLOQ","solution":"Extend the sampling window or improve assay sensitivity; report AUC0-t if extrapolation exceeds 20%."},{"problem":"Hemolysis or low plasma yield","cause":"Rough saphenous draw or delayed/insufficient centrifugation","solution":"Gentle collection, prompt processing, verify spin conditions and minimum plasma volume."},{"problem":"Welfare cap reached mid-study","cause":"Cumulative blood withdrawal approaches 10% of total blood volume","solution":"Reduce per-draw volume or drop non-critical timepoints (table t3); never exceed the cap."},{"problem":"Implausible bioavailability (F >100% or ~0)","cause":"Dosing/route error, formulation instability, or assay recovery problem","solution":"Verify dose and route records, formulation concentration, and bioanalytical recovery."}],"safety":["Conduct all animal procedures only under the approved IACUC protocol; record the approval number (compliance.iacuc).","Respect the species blood-volume limit (cumulative \u003c=10% of total blood volume) to avoid hypovolemia during serial sampling (Diehl 2001; Parasuraman 2010).","Handle the test compound and organic bioanalytical solvents (e.g. acetonitrile) per SDS in appropriate containment; dispose per compliance.wasteDisposal."],"biosafetyLevel":"not specified","studyDesign":{"groups":[{"name":"IV bolus arm (reference)","n":3,"treatment":"Single intravenous bolus of test compound, 1 mg/kg, \u003c=5 mL/kg, via lateral tail vein at t=0","description":"Reference arm defining 100% bioavailability for absolute F; each animal serially sampled across all timepoints."},{"name":"PO gavage arm","n":3,"treatment":"Single oral gavage of test compound, 10 mg/kg, \u003c=10 mL/kg, at t=0","description":"Oral arm; each animal serially sampled across all timepoints."}],"randomization":"Healthy mice block-randomized to the IV or PO arm using a computer-generated random sequence, stratified by body weight; allocation recorded before dosing.","blinding":"Samples coded at collection; the LC-MS/MS bioanalyst and the PK analyst are blinded to arm and nominal timepoint until concentrations are finalized.","timepoints":["0 min (predose baseline)","5 min","15 min","30 min","60 min","120 min","240 min"],"statisticalPlan":"Non-compartmental analysis (NCA): AUC by linear-up/log-down trapezoidal; terminal lambda_z by log-linear regression of terminal points; Cmax/Tmax observed; CL = Dose_IV/AUC0-inf_IV; Vss from CL and MRT; t1/2 = ln(2)/lambda_z. Absolute oral bioavailability F% = (AUC0-inf_PO x Dose_IV)/(AUC0-inf_IV x Dose_PO) x 100. Reported as mean +/- SD, n=3 per arm.","notes":"Serial (not discrete/composite) sampling: each animal contributes a full concentration-time curve, improving data quality and reducing animal use (Peng 2009). n=3 per arm is a typical first-tier discovery PK choice; set final group size by the study's power/precision needs (needsReview)."},"compliance":{"iacuc":"All in-life procedures must be reviewed and approved by the Institutional Animal Care and Use Committee (IACUC) before any animal work begins. The institution-specific approval/protocol number is assigned per study and must be recorded in the study file before dosing; it is not fabricated here.","consent":"Not applicable - non-human vertebrate study (no human-subjects consent required).","wasteDisposal":"Animal carcasses and blood/plasma disposed as regulated animal/biological waste; needles and lancets to sharps containers; residual test compound and organic bioanalytical solvents (e.g. acetonitrile) collected as chemical hazardous waste. Follow institutional EHS/biosafety and IACUC waste procedures.","notes":"Serial-sampling design implements the 3Rs Reduction principle (same animals sampled across all timepoints), per Peng 2009 (src1); welfare blood-volume limits per Diehl 2001 (src2) and Parasuraman 2010 (src3)."},"limitations":"Plasma PK only; no tissue distribution, metabolite identification, protein-binding correction, or multi-dose/steady-state. Exact vehicle, fasting status, per-draw blood volume, bioanalytical method (internal standard/extraction/chromatography), centrifugation settings, and NCA software are compound/lab-specific and marked needsReview. biosafetyLevel is 'not specified' because hazard depends on the test article; the ethics gate now lives in compliance (IACUC), not in biosafetyLevel as the earlier v0.2 workaround did.","sources":[{"id":"src1","kind":"article","title":"Peng SX, Rockafellow BA, Skedzielewski TM, Huebert ND, Hageman W. Improved pharmacokinetic and bioavailability support of drug discovery using serial blood sampling in mice. J Pharm Sci. 2009;98(5):1877-84.","doi":"10.1002/jps.21533","url":"https://doi.org/10.1002/jps.21533","license":"Publisher copyright; cited, not reproduced","licenseVerified":false},{"id":"src2","kind":"article","title":"Diehl KH, Hull R, Morton D, et al. A good practice guide to the administration of substances and removal of blood, including routes and volumes. J Appl Toxicol. 2001;21(1):15-23.","doi":"10.1002/jat.727","url":"https://doi.org/10.1002/jat.727","license":"Publisher copyright; cited, not reproduced","licenseVerified":false},{"id":"src3","kind":"article","title":"Parasuraman S, Raveendran R, Kesavan R. Blood sample collection in small laboratory animals. J Pharmacol Pharmacother. 2010;1(2):87-93.","doi":"10.4103/0976-500X.72350","url":"https://doi.org/10.4103/0976-500X.72350","license":"Publisher copyright (PMC free full text PMC3043327); cited, not reproduced","licenseVerified":false},{"id":"src4","kind":"article","title":"Turner PV, Brabb T, Pekow C, Vasbinder MA. Administration of substances to laboratory animals: routes of administration and factors to consider. J Am Assoc Lab Anim Sci. 2011;50(5):600-13.","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3189662/","license":"Publisher copyright (PMC free full text PMC3189662); cited, not reproduced","licenseVerified":false}],"provenance":{"library":"public","owner":"LabRecord","status":"draft"}}},{"id":"patch-clamp","label":"Patch-clamp (physics)","group":"v0.3 cross-discipline","data":{"schemaVersion":"0.3","metadata":{"title":"Whole-Cell Patch-Clamp Electrophysiology (gigaseal -> break-in -> voltage-clamp & current-clamp recording) [v0.3 instrument-physics demo]","protocolId":"lr-v03-patch-clamp","version":"0.3-demo","family":"Patch-clamp electrophysiology","category":"Electrophysiology","discipline":"Electrophysiology","purpose":"Establish the whole-cell patch-clamp configuration on a single neuron and record membrane currents (voltage clamp) and membrane potential / evoked action potentials (current clamp) using a defined instrument stimulus program.","scope":"Manual whole-cell recording from cultured / iPSC-derived neurons using a K-gluconate internal solution. Covers pipette preparation, gigaseal formation, break-in, a representative voltage-step (IV) family, and current-clamp recording. Demonstrates v0.3 instrument-physics constructs (resistance/capacitance/conductance parameter kinds, step.repeat for the sweep family, acceptanceCriteria for the seal gate). Out of scope: cell-attached / perforated / outside-out patch modes, dynamic clamp, and automated (planar) patch-clamp.","estimatedTime":"~30-60 min per cell (excluding solution/pipette preparation)","beforeYouBegin":["Freshly prepare and filter internal and external solutions; verify pH and osmolarity before use.","Pull patch pipettes to a resistance of 3-7 MOhm and, if needed, fire-polish; keep dust-free.","This JSON encodes an instrument STIMULUS PROGRAM (holding potential, voltage-step family, sampling/filter): acquisition parameters must be entered into the amplifier/acquisition software. The voltage-step family is expressed natively via step.repeat (s6) plus the program table (t3).","Liquid junction potential (LJP) for K-gluconate internal vs aCSF is not corrected here and must be measured/applied per your rig (see s8)."],"tags":["patch-clamp","electrophysiology","voltage clamp","current clamp","whole-cell","neuron","stimulus program","v0.3-demo"]},"materials":[{"id":"m1","name":"Internal (pipette) solution, K-gluconate based","role":"buffer","specification":"140 mM K-gluconate, 4 mM KCl, 0.5 mM EGTA, 10 mM HEPES, 4 mM MgATP, 0.4 mM NaGTP, 4 mM Na2-phosphocreatine; pH 7.3; osmolarity 295 mOsm/L","storage":"-20 C aliquots; keep on ice during use","rawText":"140 K-gluconate, 4 KCl, 0.5 EGTA, 10 HEPES, 4 MgATP, 0.4 NaGTP, 4 Na2-Phosphocreatine ... pH 7.3 and osmolarity 295 mOsm/L","sourceReferences":[{"sourceId":"src1","excerpt":"140 K-gluconate, 4 KCl, 0.5 EGTA, 10 HEPES, 4 MgATP, 0.4 NaGTP, 4 Na2-Phosphocreatine; pH 7.3; 295 mOsm/L"}]},{"id":"m2","name":"External (bath) recording solution, aCSF","role":"buffer","specification":"126 mM NaCl, 3 mM KCl, 2.5 mM CaCl2, 1.3 mM MgCl2, 26 mM NaHCO3, 1.25 mM NaH2PO4, 20 mM glucose; ~310 mOsm/L; bubbled with 95% O2 / 5% CO2","rawText":"126 NaCl, 3 KCl, 2.5 CaCl2, 1.3 MgCl2, 26 NaHCO3, 1.25 NaH2PO4, 20 glucose ... ~310 mOsm/L","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"aCSF: 126 NaCl, 3 KCl, 2.5 CaCl2, 1.3 MgCl2, 26 NaHCO3, 1.25 NaH2PO4, 20 glucose; ~310 mOsm/L"}]},{"id":"m3","name":"Borosilicate glass patch pipettes","role":"consumable","specification":"Pulled to 3-7 MOhm tip resistance when filled with K-gluconate internal solution","rawText":"between 3 and 7 MOhm when filled with K-Gluconate based internal solution","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"resistance between 3 and 7 MOhm ... (5 MOhm standard)"}]},{"id":"m4","name":"Tetrodotoxin (TTX)","role":"reagent","workingConcentration":"20 uM","specification":"Voltage-gated Na+ channel blocker; optional, to isolate non-Na+ currents","hazard":"Potent neurotoxin; handle per institutional rules","rawText":"20 uM TTX","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"2 mM CoCl2 and 20 uM TTX to isolate specific channel types"}]},{"id":"m5","name":"Cobalt chloride (CoCl2)","role":"reagent","workingConcentration":"2 mM","specification":"Non-specific Ca2+ channel blocker; optional","rawText":"2 mM CoCl2","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"2 mM CoCl2 and 20 uM TTX to isolate specific channel types"}]}],"equipment":[{"id":"e1","name":"Patch-clamp amplifier","model":"Axopatch 200B (Axon Instruments)","settings":"Whole-cell voltage-clamp and current-clamp; fast (pipette) and slow (whole-cell) capacitance compensation; low-pass Bessel filter; series-resistance compensation as needed","rawText":"analog Axopatch 200B amplifier","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"analog Axopatch 200B amplifier"}]},{"id":"e2","name":"Digitizer + acquisition software","model":"Digidata 1322A; pClamp 8.1 / Clampfit (Axon Instruments)","settings":"Sampling 10 kHz; stimulus waveforms defined in pClamp","rawText":"DigiData 1322A ... pClamp 8.1 software ... Clampfit","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"DigiData 1322A ... pClamp 8.1 software ... Clampfit"}]},{"id":"e3","name":"Micropipette puller","settings":"Program to yield 3-7 MOhm patch pipettes","needsReview":true},{"id":"e4","name":"Recording rig: upright microscope, micromanipulator, and gravity/peristaltic perfusion","settings":"Continuous bath perfusion at ~1.5 mL/min","rawText":"1.5 mL per minute","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"1.5 mL per minute"}]}],"samples":[{"id":"sp1","name":"Cultured / iPSC-derived neurons","role":"input","kind":"organism","organism":"Homo sapiens (iPSC-derived)","description":"Adherent neurons in the recording chamber; single healthy cell selected for patching.","needsReview":true},{"id":"sp2","name":"Whole-cell recording (digitized current/voltage traces)","role":"output","kind":"dataset","dataType":"ABF (voltage-clamp current families and current-clamp membrane-potential / action-potential traces)"},{"id":"sp3","name":"Analyzed membrane properties","role":"output","kind":"dataset","dataType":"table (IV relationship, input resistance/conductance, membrane capacitance, firing properties)"}],"containers":[{"id":"c1","name":"Recording chamber / bath on microscope stage","type":"chamber","needsReview":true}],"tables":[{"id":"t1","title":"Internal (pipette) solution recipe","kind":"recipe","columns":["Component","Concentration (mM)"],"rows":[["K-gluconate",140],["KCl",4],["EGTA",0.5],["HEPES",10],["MgATP",4],["NaGTP",0.4],["Na2-phosphocreatine",4]],"note":"pH 7.3; osmolarity 295 mOsm/L. Source src1."},{"id":"t2","title":"External (bath) aCSF recipe","kind":"recipe","columns":["Component","Concentration (mM)"],"rows":[["NaCl",126],["KCl",3],["CaCl2",2.5],["MgCl2",1.3],["NaHCO3",26],["NaH2PO4",1.25],["glucose",20]],"note":"~310 mOsm/L; bubble with 95% O2 / 5% CO2. Source src1."},{"id":"t3","title":"Voltage-clamp step family (stimulus program)","kind":"program","columns":["Parameter","Value","Note"],"rows":[["Command mode","Voltage clamp",""],["Holding potential","-70 mV","-70 mV for EPSCs; 0 mV for IPSCs (src1)"],["First step level","-80 mV","representative IV family (src2 examples)"],["Last step level","+50 mV","representative IV family (src2 examples)"],["Step increment","5 mV","src2 examples of +-5 mV steps"],["Step duration","50 ms","src2"],["Inter-sweep interval","2 s","representative"],["Number of sweeps",27,"DERIVED = (span -80..+50 mV)/5 + 1; encoded natively as step.repeat.count on s6"]],"note":"The sweep loop itself is encoded natively on step s6 via step.repeat (count 27); this program table (kind 'program') documents the per-parameter waveform. Values are representative and combined across sources; treat as needsReview and confirm against the target current under study.","needsReview":true}],"steps":[{"id":"s1","number":1,"phase":"Preparation","action":"Pull a borosilicate pipette, back-fill it with K-gluconate internal solution, and mount it on the amplifier headstage. Apply light positive pressure, lower the tip into the bath, and measure the pipette (tip) resistance from the response to a small voltage test pulse.","materialIds":["m1","m3"],"equipmentIds":["e1","e3"],"tableIds":["t1"],"inputIds":["m1"],"parameters":[{"type":"resistance","value":3,"valueMax":7,"comparator":"range","unit":"MOhm","rawText":"between 3 and 7 MOhm","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"between 3 and 7 MOhm ... 5 MOhm standard"}]}],"acceptanceCriteria":[{"parameter":"pipette (tip) resistance","comparator":"range","value":3,"valueMax":7,"unit":"MOhm","classification":"accept pipette if 3-7 MOhm (5 MOhm standard)","description":"Tip-resistance window; reject clogged or over/under-pulled pipettes.","needsReview":true}],"expectedResult":"Stable pipette resistance of 3-7 MOhm with no clogging.","criticalNotes":"v0.3: pipette resistance is a native parameter.type 'resistance' (was 'other' + unit MOhm in the v0.2 workaround).","sourceReferences":[{"sourceId":"src1","excerpt":"3 and 7 MOhm ... 5 MOhm standard"}]},{"id":"s2","number":2,"phase":"Preparation","action":"Place cells in the recording chamber and start continuous bath perfusion with oxygenated aCSF; select a single healthy cell for patching.","materialIds":["m2"],"equipmentIds":["e4"],"containerIds":["c1"],"inputIds":["sp1","m2"],"tableIds":["t2"],"parameters":[{"type":"flowRate","value":1.5,"unit":"mL/min","rawText":"1.5 mL per minute","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"1.5 mL per minute"}]}],"expectedResult":"Healthy cell identified; stable perfusion, no bubbles over the cell.","criticalNotes":"v0.3: perfusion flow rate is a native parameter.type 'flowRate' (was 'other' + unit mL/min in the v0.2 workaround).","sourceReferences":[{"sourceId":"src1","excerpt":"1.5 mL per minute"}]},{"id":"s3","number":3,"phase":"Seal formation","action":"Apply light positive pressure, lower the pipette onto the cell, then release the pressure to form a gigaseal; monitor seal formation with a repeated voltage test pulse. Once the gigaseal is stable, cancel the fast (pipette) capacitance transients.","materialIds":["m3"],"equipmentIds":["e1"],"inputIds":["sp1"],"parameters":[{"type":"voltage","value":10,"unit":"mV","rawText":"10 mV test pulse","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"10 mV test pulse at 100 Hz"}]},{"type":"frequency","value":100,"unit":"Hz","rawText":"10 mV test pulse at 100 Hz","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"10 mV test pulse at 100 Hz"}]},{"type":"resistance","value":1,"comparator":"min","unit":"GOhm","rawText":"obtain a GOhm seal (minimum 1 GOhm)","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"Release the positive pressure to obtain a GOhm seal ... 1 GOhm"}]},{"type":"capacitance","value":null,"unit":"pF","rawText":"cancel fast pipette capacitance (Cfast); typical value read from the transient, not fixed by source","needsReview":true}],"acceptanceCriteria":[{"parameter":"seal resistance","comparator":"min","value":1,"unit":"GOhm","classification":"accept cell only if seal resistance >= 1 GOhm (gigaseal)","description":"Seal-quality go/no-go gate before break-in.","onFailStepId":"s1"}],"expectedResult":"Seal resistance >= 1 GOhm (gigaseal).","criticalNotes":"v0.3: seal resistance is native parameter.type 'resistance', and the >=1 GOhm gate is a native step.acceptanceCriteria (comparator 'min') instead of the v0.2 free-text control. The test pulse combines a voltage (mV) and a repetition frequency (Hz).","sourceReferences":[{"sourceId":"src1","excerpt":"10 mV test pulse at 100 Hz ... Release the positive pressure to obtain a GOhm seal ... 1 GOhm"},{"sourceId":"src3","excerpt":"giga-seals (pipette-membrane seals with resistances of 10^9-10^11 Ohm)"}]},{"id":"s4","number":4,"phase":"Break-in","action":"Rupture the patch to enter whole-cell mode using brief suction pulses or the amplifier 'zap' function. Compensate the whole-cell (slow) capacitance and series resistance, then monitor series (access) resistance and read the whole-cell membrane capacitance.","equipmentIds":["e1"],"outputIds":["sp2"],"parameters":[{"type":"resistance","value":null,"unit":"MOhm","rawText":"monitor series (access) resistance (no target value given for this cell type)","needsReview":true},{"type":"capacitance","value":null,"unit":"pF","rawText":"read whole-cell membrane capacitance (Cm) from the capacitive transient / amplifier whole-cell (slow) compensation; value is cell-specific, not fixed by source","needsReview":true}],"acceptanceCriteria":[{"parameter":"series (access) resistance","comparator":"max","value":null,"unit":"MOhm","classification":"keep recordings with stable, low access resistance; discard on substantial Ra drift (upper-bound target is rig-dependent, not fixed by the sources)","description":"Access-resistance monitoring gate; set the numeric ceiling per rig.","needsReview":true}],"expectedResult":"Whole-cell configuration achieved; capacitive transients appear; stable, low series resistance.","criticalNotes":"v0.3: series/access resistance is native parameter.type 'resistance' and whole-cell membrane capacitance is native 'capacitance' (pF) - both were unavailable in v0.2 (resistance was 'other'; capacitance had no representation). Values are null + needsReview because the sources give no target for this cell type.","sourceReferences":[{"sourceId":"src1","excerpt":"Apply light and short suction pulses ... or brief electrical pulses via zap function"},{"sourceId":"src3","excerpt":"whole-cell recording ... access to the cell interior after rupturing the patch"}]},{"id":"s5","number":5,"phase":"Acquisition setup","action":"Configure the acquisition: set the holding potential and the digitizer sampling rate and anti-alias (low-pass) filter.","equipmentIds":["e1","e2"],"parameters":[{"type":"voltage","value":-70,"unit":"mV","rawText":"-70 mV to record spontaneous excitatory postsynaptic currents","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"-70 mV ... 0 mV holding"}]},{"type":"voltage","value":0,"unit":"mV","rawText":"0 mV to record spontaneous inhibitory postsynaptic currents","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"-70 mV ... 0 mV holding"}]},{"type":"frequency","value":10,"unit":"kHz","rawText":"sampling frequency of 10 kHz","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"sampling frequency of 10 kHz"}]},{"type":"frequency","value":null,"unit":"kHz","rawText":"low-pass filter; set below Nyquist and appropriate to the signal (src2 reports a Gaussian -3 dB cutoff at 50 Hz for a specific analysis; a fast current family is typically filtered at ~2-5 kHz)","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"Lowpass filtered (Gaussian, -3 dB cutoff at 50 Hz)"}]}],"expectedResult":"Amplifier held at command potential; acquisition sampling and filter configured.","criticalNotes":"Sampling rate and filter cutoff map cleanly to parameter.type 'frequency'; holding potential to 'voltage'. Filter cutoff left null + needsReview: the source's 50 Hz Gaussian is a specific-analysis example, not the setting for a fast IV family.","sourceReferences":[{"sourceId":"src1","excerpt":"-70 mV ... 0 mV holding"},{"sourceId":"src2","excerpt":"sampling frequency of 10 kHz; Lowpass filtered (Gaussian, -3 dB cutoff at 50 Hz)"}]},{"id":"s6","number":6,"phase":"Voltage-clamp recording","action":"Run the voltage-step (IV) family: from the holding potential, apply command steps across the range in fixed increments, each held for the step duration, repeating every inter-sweep interval; acquire the current family.","equipmentIds":["e1","e2"],"tableIds":["t3"],"outputIds":["sp2"],"repeat":{"count":27,"over":"voltage-step sweeps from -80 mV to +50 mV in 5 mV increments","notes":"n = (Vmax - Vmin)/increment + 1 = (50 - (-80))/5 + 1 = 27 sweeps; representative family, verify against the rig and the current under study."},"parameters":[{"type":"voltage","value":-80,"valueMax":50,"comparator":"range","unit":"mV","rawText":"steps from -80 mV to +50 mV","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"+-5 mV, +-10 mV steps (50 ms); steps to +50/+60 mV"}]},{"type":"voltage","value":5,"unit":"mV","rawText":"5-mV increments","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"+-5 mV steps"}]},{"type":"time","value":50,"unit":"ms","rawText":"50 ms per step","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"steps (50 ms)"}]},{"type":"time","value":2,"unit":"s","rawText":"every 2 s (representative inter-sweep interval)","needsReview":true},{"type":"count","value":27,"unit":"sweeps","formula":"n = (Vmax - Vmin)/increment + 1 = (50 - (-80))/5 + 1","rawText":"DERIVED number of sweeps for the -80..+50 mV family in 5 mV steps","needsReview":true}],"expectedResult":"A family of voltage-dependent membrane currents; an IV relationship can be constructed.","criticalNotes":"v0.3: the sweep loop is encoded natively via step.repeat (count 27) instead of the v0.2 table-only workaround; the derived sweep count also demonstrates parameter.formula. Table t3 (kind 'program') documents the waveform.","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"+-5 mV, +-10 mV steps (50 ms); steps to +50/+60 mV"}]},{"id":"s7","number":7,"phase":"Current-clamp recording","action":"Switch the amplifier to current-clamp; hold the cell near rest with a small bias current, then inject a family of depolarizing current steps to evoke action potentials.","equipmentIds":["e1","e2"],"outputIds":["sp2"],"repeat":{"count":null,"over":"depolarizing current-step sweeps","notes":"Number and amplitude of current steps not specified in the sources; set per experiment (e.g. incrementing pA steps until firing saturates)."},"parameters":[{"type":"voltage","value":-70,"valueMax":-60,"comparator":"range","unit":"mV","rawText":"current-clamp target close to the expected resting potential (-60 to -70 mV)","needsReview":true,"sourceReferences":[{"sourceId":"src1","excerpt":"Change to a negative voltage close to the expected cell resting potential (-60 to -70 mV)"}]},{"type":"current","value":null,"unit":"pA","rawText":"inject depolarizing current steps (step size/range not specified in source)","needsReview":true}],"expectedResult":"Resting membrane potential recorded; graded action-potential firing with increasing current injection.","criticalNotes":"v0.3: the current-step family is encoded via step.repeat (open count + untilCondition-style note). The injection amplitude (pA) is native parameter.type 'current' with value null + needsReview because the sources do not specify the step size/range.","sourceReferences":[{"sourceId":"src1","excerpt":"Change to a negative voltage close to the expected cell resting potential (-60 to -70 mV)"}]},{"id":"s8","number":8,"phase":"Analysis","action":"Save and analyze traces (e.g., in Clampfit); apply the liquid junction potential correction and report membrane properties (IV curves, input resistance/conductance, membrane capacitance, firing properties).","equipmentIds":["e2"],"inputIds":["sp2"],"outputIds":["sp3"],"parameters":[{"type":"voltage","value":null,"unit":"mV","formula":"V_corrected = V_command - V_LJP","rawText":"liquid junction potential (K-gluconate internal vs aCSF) not corrected during recording; measure and subtract per rig","needsReview":true},{"type":"resistance","value":null,"unit":"MOhm","rawText":"input resistance (Rin) from the steady-state response to a small hyperpolarizing step","needsReview":true},{"type":"conductance","value":null,"unit":"nS","formula":"Gin = 1 / Rin","rawText":"input conductance (Gin), reciprocal of input resistance","needsReview":true},{"type":"capacitance","value":null,"unit":"pF","rawText":"report whole-cell membrane capacitance (Cm) per cell","needsReview":true}],"expectedResult":"IV curves, input resistance/conductance, membrane capacitance, and firing properties reported.","criticalNotes":"v0.3: input resistance ('resistance'), input conductance ('conductance', with formula Gin = 1/Rin), and membrane capacitance ('capacitance') are all native parameter kinds. The LJP correction uses parameter.formula. All values null + needsReview: they are measured per cell, not fixed by the sources.","needsReview":true,"sourceReferences":[{"sourceId":"src2","excerpt":"Clampfit (pClamp, Axon Instruments)"}]}],"controls":[{"name":"Gigaseal quality control","description":"Accept a cell only if seal resistance is >= 1 GOhm before break-in (enforced by the acceptanceCriteria on s3)."},{"name":"Series-resistance monitoring","description":"Track series (access) resistance throughout (acceptanceCriteria on s4); discard the recording if it drifts substantially.","needsReview":true},{"name":"Pharmacological isolation control","description":"Optionally apply 20 uM TTX and/or 2 mM CoCl2 to confirm the identity of recorded currents (Na+ / Ca2+).","needsReview":true}],"expectedOutputs":["Gigaohm seal (>= 1 GOhm) followed by stable whole-cell access.","Voltage-clamp current family and derived current-voltage (IV) relationship.","Current-clamp resting membrane potential and evoked action-potential traces.","Digitized recording files with the stimulus program metadata, plus reported input resistance/conductance and membrane capacitance."],"troubleshooting":[{"problem":"Cannot form a gigaseal","cause":"Dirty pipette tip, unhealthy cell, or too much positive pressure","solution":"Use a fresh pipette, select a healthier cell, and reduce positive pressure before contact"},{"problem":"Seal lost on break-in","cause":"Excessive suction/zap","solution":"Use gentler, briefer suction pulses or a shorter zap"},{"problem":"Rundown / unstable currents","cause":"Rising series resistance or dialysis of the cell","solution":"Monitor and compensate series resistance; limit recording duration"},{"problem":"Distorted / aliased currents","cause":"Filter cutoff or sampling rate set inappropriately","solution":"Set the low-pass filter below the Nyquist frequency and sample at >= 2x the filter cutoff"}],"safety":["TTX is a potent neurotoxin; CoCl2 is toxic - handle and dispose per institutional rules.","Follow institutional biosafety approval for the specific cell source (human iPSC-derived neurons)."],"biosafetyLevel":"needsReview","limitations":"The voltage-step family (range/increment/duration/interval/sweep count) and the current-clamp injection family are representative, combined across sources, and marked needsReview; tailor them to the current/cell under study. Filter cutoff, series-resistance ceiling, membrane capacitance, temperature, and the liquid junction potential are not fixed by the primary sources and are flagged needsReview. Manual whole-cell recording only.","sources":[{"id":"src1","kind":"url","title":"Whole Cell Patch Clamp Recordings for Characterizing Neuronal Electrical Properties of iPSC-derived neurons (Ana Gonzalez Rueda, Ole Paulsen Lab, University of Cambridge)","url":"https://axolbio.com/publications/whole-cell-patch-clamp-protocol/","license":"(c) AXOL Bioscience Ltd. All Rights Reserved; reuse terms not specified","licenseVerified":false},{"id":"src2","kind":"article","title":"Whole-cell patch-clamp recording and parameters (Kodirov, Biophysical Reviews, 2023)","doi":"10.1007/s12551-023-01055-8","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10133435/","license":"(c) IUPAB and Springer-Verlag GmbH Germany, part of Springer Nature 2023","licenseVerified":false},{"id":"src3","kind":"article","title":"Improved patch-clamp techniques for high-resolution current recording from cells and cell-free membrane patches (Hamill, Marty, Neher, Sakmann, Sigworth; Pflugers Archiv 391:85-100, 1981)","doi":"10.1007/BF00656997","url":"https://doi.org/10.1007/BF00656997","license":"Cited (foundational method), not reproduced","licenseVerified":false}],"provenance":{"library":"public","owner":"LabRecord","status":"draft","derivedFromVersionId":"lr-stress-patch-clamp"}}},{"id":"pcr-999-addgene-pcr","label":"Addgene Standard PCR","group":"Section 1 examples","data":{"schemaVersion":"0.3","metadata":{"title":"PCR-999: Addgene Standard PCR Protocol","protocolId":"PCR-999","version":"0.1","family":"PCR","category":"PCR & Amplification","discipline":"Biology","purpose":"Amplify a specific DNA region in vitro using Taq DNA polymerase through repeated heating and cooling cycles. Based on the Addgene standard PCR protocol for a 50 uL Taq-style reaction.","scope":"Standard endpoint PCR using Taq polymerase. Not validated for qPCR, RT-PCR, or high-fidelity cloning workflows.","estimatedTime":"~2-3 hours (setup + cycling + gel verification)","beforeYouBegin":["Keep all reagents on ice during setup to maintain enzyme activity.","Use thin-walled PCR tubes for optimal heat transfer in the thermal cycler.","Design primers using tools such as Primer3. Ensure primers are 18-24 nt, 40-60% GC content, with Tm within 5 degrees C of each other.","For multiple reactions, prepare a master mix containing all shared components (except primers and template) with 10% extra volume to account for pipetting loss.","Use a clean workspace with dedicated pre-PCR pipettes and aerosol-resistant tips."],"tags":["PCR","endpoint PCR","DNA amplification","Taq","thermal cycling","Addgene"]},"materials":[{"id":"m1","name":"Template DNA","role":"sample","amount":2,"unit":"uL","specification":"10-500 ng total; plasmid DNA, genomic DNA, cDNA, or purified amplicon","storage":"Keep on ice during setup"},{"id":"m2","name":"10X Taq buffer with MgCl2","role":"buffer","amount":5,"unit":"uL","specification":"Provides optimal chemical environment; divalent cations stabilize interactions","storage":"Store at -20 degrees C; keep on ice during use"},{"id":"m3","name":"dNTP mix (10 mM each nucleotide)","role":"reagent","workingConcentration":"10 mM each","amount":1,"unit":"uL","specification":"Equal molar ratio of dATP, dTTP, dGTP, dCTP; final 200 uM each in reaction","storage":"Store at -20 degrees C; avoid repeated freeze-thaw"},{"id":"m4","name":"Forward primer","role":"reagent","workingConcentration":"10 uM stock","amount":2.5,"unit":"uL","specification":"Final 0.5 uM in reaction; anneals upstream (5') of target segment","storage":"Store at -20 degrees C; keep on ice during use"},{"id":"m5","name":"Reverse primer","role":"reagent","workingConcentration":"10 uM stock","amount":2.5,"unit":"uL","specification":"Final 0.5 uM in reaction; anneals downstream (3') of target segment","storage":"Store at -20 degrees C; keep on ice during use"},{"id":"m6","name":"Taq DNA polymerase","role":"enzyme","workingConcentration":"5 U/uL","amount":0.2,"unit":"uL","specification":"Heat-resistant enzyme from Thermus aquaticus; 1 U per 50 uL reaction; optimal activity around 70 degrees C","storage":"Store at -20 degrees C; keep on ice; do NOT vortex"},{"id":"m7","name":"Sterile dH2O","role":"solvent","amount":36.8,"unit":"uL","specification":"Molecular biology grade; nuclease-free","storage":"Room temperature"},{"id":"m8","name":"25 mM MgCl2 (optional)","role":"reagent","amount":1,"unit":"uL","specification":"For optimization if PCR fails; add to increase Mg2+ concentration","storage":"Store at -20 degrees C","needsReview":true},{"id":"m9","name":"DMSO (optional)","role":"reagent","amount":1,"unit":"uL","specification":"For GC-rich templates; aids denaturation of secondary structures","storage":"Room temperature","needsReview":true}],"equipment":[{"id":"e1","name":"PCR machine (thermal cycler)","settings":"See cycling program table"},{"id":"e2","name":"Thin-walled PCR tubes","settings":"0.2 mL thin-walled tubes for optimal heat transfer"},{"id":"e3","name":"Agarose gel electrophoresis apparatus","settings":"For post-run product verification"},{"id":"e4","name":"Ice bucket / cold block","settings":"Keep reagents cold during setup"},{"id":"e5","name":"Microcentrifuge","settings":"Brief spin to collect liquid"},{"id":"e6","name":"Gel documentation system","settings":"UV or blue-light imaging"}],"tables":[{"id":"t1","title":"50 uL Reaction Setup","kind":"recipe","columns":["Component","Stock concentration","Volume (uL)","Final condition"],"rows":[["Template DNA","Variable","2","10-500 ng"],["10X Taq buffer with MgCl2","10X","5","1X"],["dNTP mix","10 mM each","1","200 uM each"],["Forward primer","10 uM","2.5","0.5 uM"],["Reverse primer","10 uM","2.5","0.5 uM"],["Taq DNA polymerase","5 U/uL","0.2","1 U/reaction"],["Sterile dH2O","—","36.8","To 50 uL total"]],"note":"Volumes are for a single 50 uL reaction. For master mix preparation, multiply each volume by (N + 10%) where N is the number of reactions."},{"id":"t2","title":"Cycling Program","kind":"program","columns":["Step","Temperature","Time","Cycles"],"rows":[["Initial denaturation","94 degrees C","2 min","1"],["Denaturation","94 degrees C","30 sec","25-30"],["Annealing","55 degrees C (Tm - 5 degrees C)","30 sec","25-30"],["Extension","72 degrees C","1 min per kb","25-30"],["Final extension","72 degrees C","5 min","1"],["Hold","4 degrees C","Indefinite","1"]],"note":"Annealing temperature should be set approximately 5 degrees C below the primer melting temperature (Tm). Extension time depends on amplicon size at approximately 1-2 kb per minute for Taq polymerase."},{"id":"t3","title":"Master Mix Calculation Example (7 reactions)","kind":"recipe","columns":["Component","Per reaction (uL)","x 7.7 (uL)"],"rows":[["10X Taq buffer","5","38.5"],["dNTP mix","1","7.7"],["Template DNA","2","15.4"],["Sterile dH2O","36.8","283.3"],["Taq DNA polymerase","0.2","1.54"]],"note":"Multiply reagent volumes by (number of reactions + 10% overage). Primers are added individually to each tube and are NOT included in the master mix."},{"id":"t4","title":"Primer Dilution Guide","kind":"other","columns":["Step","Procedure"],"rows":[["100 uM stock preparation","Add dH2O in uL equal to (nanomoles x 10) to the lyophilized primer pellet"],["10 uM working stock","Dilute 1:10 from 100 uM stock (100 uL stock + 900 uL dH2O)"]]}],"steps":[{"id":"s1","number":1,"phase":"Primer Preparation","action":"Design primers using a tool such as Primer3. Primers should be complementary to sequences flanking the target region, annealing upstream (5') and downstream (3') of the DNA segment to be amplified.","tableIds":["t4"],"expectedResult":"Primers designed and diluted to 10 uM working stock."},{"id":"s2","number":2,"phase":"Primer Preparation","action":"Prepare primer stocks: reconstitute lyophilized primers to 100 uM by adding dH2O (in uL) equal to nanomoles x 10. Then prepare 10 uM working stocks by 1:10 dilution (100 uL of 100 uM stock + 900 uL dH2O).","materialIds":["m4","m5","m7"],"tableIds":["t4"],"expectedResult":"Forward and reverse primers at 10 uM working concentration."},{"id":"s3","number":3,"phase":"Reaction Setup","action":"Place thin-walled PCR tubes on ice. Label tubes for each sample, including a no-template control (NTC) and a positive control.","equipmentIds":["e2","e4"],"expectedResult":"Labeled PCR tubes on ice ready for reagent addition."},{"id":"s4","number":4,"phase":"Reaction Setup","action":"For multiple reactions, prepare a master mix: multiply each reagent volume by the number of reactions plus 10% extra. Combine water, buffer, dNTPs, and Taq polymerase in a single tube. Mix gently by pipetting. Do NOT include primers in the master mix.","materialIds":["m7","m2","m3","m6"],"tableIds":["t1","t3"],"criticalNotes":"Add polymerase last. Do NOT vortex — mix by gentle pipetting. Keep on ice at all times.","expectedResult":"Homogeneous master mix on ice, ready for aliquoting."},{"id":"s5","number":5,"phase":"Reaction Setup","action":"Add forward primer (2.5 uL) and reverse primer (2.5 uL) to each PCR tube individually.","materialIds":["m4","m5"],"parameters":[{"type":"volume","value":2.5,"unit":"uL","rawText":"2.5 uL each primer (10 uM stock)"}],"expectedResult":"Primers dispensed into individual reaction tubes."},{"id":"s6","number":6,"phase":"Reaction Setup","action":"Add 45 uL of master mix to each tube (50 uL total minus 2.5 uL forward primer minus 2.5 uL reverse primer). Then add template DNA last. For NTC, add sterile dH2O instead of template.","materialIds":["m1","m7"],"parameters":[{"type":"volume","value":45,"unit":"uL","rawText":"45 uL master mix per tube"},{"type":"volume","value":2,"unit":"uL","rawText":"2 uL template DNA (10-500 ng)"}],"criticalNotes":"Add template last. Load NTC last to minimize contamination risk.","expectedResult":"All 50 uL reactions assembled with template added last."},{"id":"s7","number":7,"phase":"Reaction Setup","action":"Secure tube caps. Gently tap tubes to mix contents and briefly centrifuge to collect liquid at the bottom and remove bubbles.","equipmentIds":["e5"],"expectedResult":"Liquid collected at tube bottom, no air bubbles."},{"id":"s8","number":8,"phase":"Thermal Cycling","action":"Place tubes in the PCR machine. Set the annealing temperature to approximately 5 degrees C below the primer melting temperature (Tm). Set extension time to 1-2 minutes per kilobase of expected amplicon length.","equipmentIds":["e1"],"tableIds":["t2"],"parameters":[{"type":"temperature","value":94,"unit":"°C","rawText":"Initial denaturation: 94 degrees C for 2 min"},{"type":"temperature","value":55,"unit":"°C","rawText":"Annealing: ~55 degrees C (Tm - 5 degrees C) for 30 sec"},{"type":"temperature","value":72,"unit":"°C","rawText":"Extension: 72 degrees C for 1 min/kb"}],"expectedResult":"Thermal cycler programmed and running."},{"id":"s9","number":9,"phase":"Thermal Cycling","action":"Run the cycling program: initial denaturation at 94 degrees C for 2 min, then 25-30 cycles of denaturation (94 degrees C, 30 sec), annealing (55 degrees C, 30 sec), and extension (72 degrees C, 1 min/kb), followed by a final extension at 72 degrees C for 5 min.","equipmentIds":["e1"],"tableIds":["t2"],"repeat":{"count":30,"over":"thermocycles","notes":"25-30 cycles; adjust based on template abundance and amplicon size"},"expectedResult":"Cycling complete; PCR products amplified."},{"id":"s10","number":10,"phase":"Post-run Verification","action":"Run 2 uL of PCR product on an agarose gel with an appropriate DNA size ladder to verify band size and concentration.","equipmentIds":["e3","e6"],"parameters":[{"type":"volume","value":2,"unit":"uL","rawText":"2 uL product loaded on gel"}],"acceptanceCriteria":[{"parameter":"Sample band","description":"Single band at expected amplicon size","comparator":"exact"},{"parameter":"NTC","description":"No target-size band in no-template control"},{"parameter":"Positive control","description":"Expected band present"}],"expectedResult":"Single band at expected size in sample lanes; clean NTC; positive control confirmed."}],"controls":[{"name":"No-template control (NTC)","description":"Replace template DNA with sterile dH2O to detect reagent or environmental contamination. No target-size band expected."},{"name":"Positive control","description":"Use a known template that reliably amplifies to verify master mix, cycling program, and detection are working. Expected band should appear."}],"expectedOutputs":["Single band at the expected amplicon size on agarose gel.","Clean NTC lane (no target-size band).","Positive control band at expected size.","Complete run record with sample map, reagent details, cycling program, and gel image."],"troubleshooting":[{"problem":"No band / PCR failure","cause":"Wrong annealing temperature, missing component, degraded template, inhibitors in template preparation","solution":"Verify setup; lower annealing temperature step-wise; add 1 uL 25 mM MgCl2 and/or 1 uL DMSO per reaction; use fresh enzyme; dilute template to reduce inhibitors"},{"problem":"Non-specific products / multiple bands","cause":"Annealing temperature too low, excess template or primer, nonspecific primer binding","solution":"Increase annealing temperature step-wise by 1-2 degrees C; reduce template or primer concentration; consider hot-start polymerase; redesign primers"},{"problem":"Smear on gel","cause":"Overcycling, degraded template, nonspecific amplification","solution":"Reduce cycle number; improve template quality; optimize annealing temperature; load less product on gel"},{"problem":"Primer dimer","cause":"Primer complementarity, excess primer concentration","solution":"Reduce primer concentration to 0.2-0.3 uM; redesign primers to minimize 3' complementarity"},{"problem":"Weak band from GC-rich template","cause":"Strong secondary structures in GC-rich regions resist denaturation","solution":"Increase denaturation time; add 1 uL DMSO per reaction; consider specialized GC-rich PCR kits"}],"safety":["Ethidium bromide or alternative DNA stains may be mutagenic — wear gloves when handling gels and follow institutional disposal rules.","UV transilluminators emit UV radiation — use eye and skin protection."],"sources":[{"id":"src1","kind":"url","title":"Addgene PCR Protocol","url":"https://www.addgene.org/protocols/pcr/","license":"Addgene educational use","licenseVerified":false}],"provenance":{"library":"public","owner":"LabRecord","status":"draft"}}}];

const nav = document.getElementById('nav');
const view = document.getElementById('view');
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const groups = {};
PROTOCOLS.forEach((p,i)=>{ (groups[p.group]=groups[p.group]||[]).push(Object.assign({idx:i},p)); });
let navHtml='';
for(const g in groups){
  navHtml+='<h4>'+escapeHtml(g)+'</h4>';
  groups[g].forEach(p=>{ navHtml+='<button class="nav-item" data-idx="'+p.idx+'">'+escapeHtml(p.label)+'<small>'+escapeHtml((p.data.metadata.family||''))+'</small></button>'; });
}
navHtml+='<h4>Reference</h4>';
navHtml+='<button class="nav-item" data-view="schema">Canonical JSON Schema</button>';
navHtml+='<button class="nav-item" data-view="about">About this demo</button>';
nav.innerHTML=navHtml;

function showProtocol(idx){
  const p=PROTOCOLS[idx];
  const rendered=window.renderProtocolHTML(p.data);
  const json=JSON.stringify(p.data,null,2);
  view.innerHTML='<div class="doc-note">Rendered live from <code>examples/'+p.id+'.json</code> by <code>renderer.js</code> — the same JSON produces this human-readable document.</div>'
    +rendered
    +'<details class="jsonbox"><summary>Show JSON source ('+ (p.data.steps||[]).length +' steps)</summary><pre>'+escapeHtml(json)+'</pre></details>';
  window.scrollTo(0,0);
}
function showSchema(){ view.innerHTML='<h1>Canonical JSON Schema (v0.1)</h1><p class="doc-note">Every protocol is validated against this schema before it is saved. See <code>renderer/validate.mjs</code>.</p><pre class="schema-pre">'+escapeHtml(SCHEMA_TEXT)+'</pre>'; window.scrollTo(0,0); }
function showAbout(){
  view.innerHTML='<article class="protocol"><h1>About this demo</h1>'
    +'<p>This page demonstrates deliverables for <b>Sections 1 &amp; 2</b> of the Protocol Library plan:</p>'
    +'<ul>'
    +'<li><b>Section 1 — Format Standard:</b> a fixed section layout (Purpose, Scope, Before You Begin, Materials, Equipment, Procedure table, Controls, Expected Outputs, Troubleshooting, Safety, Sources &amp; License).</li>'
    +'<li><b>Section 2 — Canonical Schema + renderer:</b> a JSON Schema (<code>canonical-schema.json</code>), example JSON instances, and this JSON→document renderer (<code>renderer.js</code>).</li>'
    +'</ul>'
    +'<p><b>Section 1 examples:</b> Western blot (from a real teaching PDF), RT-qPCR (MIQE-aligned), cell-culture subculture.</p>'
    +'<p><b>Real PDF test data (generated):</b> Gel Filtration and Protein Concentration, transcribed from the source PDFs into the canonical format.</p>'
    +'<p>Orange <span class="review">needs review</span> marks values that were not stated in the source and must be human-verified — the schema forbids fabricating them.</p>'
    +'<p>The <code>provenance</code> block (library / owner / status) is a forward-compatible hook for the Library &amp; Version design (Section 3).</p>'
    +'</article>';
  window.scrollTo(0,0);
}
nav.addEventListener('click',function(e){
  const b=e.target.closest('.nav-item'); if(!b)return;
  Array.prototype.forEach.call(nav.querySelectorAll('.nav-item'),x=>x.classList.remove('active'));
  b.classList.add('active');
  if(b.dataset.view==='schema') showSchema();
  else if(b.dataset.view==='about') showAbout();
  else showProtocol(+b.dataset.idx);
});
nav.querySelector('.nav-item').click();
