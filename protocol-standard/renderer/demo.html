500 mL)","needsReview":true},{"id":"m15","name":"Trifluoromethanesulfonic anhydride (Tf2O)","role":"reagent","molecularWeight":282.13,"casNumber":"358-23-6","smiles":"O=S(=O)(OS(=O)(=O)C(F)(F)F)C(F)(F)F","specification":"97-99%; 1.0 equiv (Step C)","vendor":"Fluorochem / Sigma-Aldrich","hazard":"Corrosive; reacts violently with water; lachrymator.","rawText":"Triflic anhydride (4.20 mL, 25.0 mmol, 1.0 equiv)","needsReview":true,"sourceReferences":[{"sourceId":"src1","page":260,"excerpt":"Triflic anhydride (4.20 mL, 25.0 mmol, 1.0 equiv)"}]},{"id":"m16","name":"Methanol","role":"solvent","molecularWeight":32.04,"casNumber":"67-56-1","smiles":"CO","specification":"quench for Step C","hazard":"Flammable; toxic.","rawText":"quenched by addition of methanol (5 mL)"},{"id":"m17","name":"Silica gel (230-400 mesh, grade 60)","role":"consumable","specification":"50 mL to adsorb crude; 95 g for the column (16.0 x 6.0 cm)","vendor":"Fisher Chemical","rawText":"Silica gel (50 mL) ... slurry of silica gel in CH2Cl2 (95 g silica gel, 16.0 x 6.0 cm)"},{"id":"m18","name":"Acetone","role":"solvent","molecularWeight":58.08,"casNumber":"67-64-1","smiles":"CC(C)=O","specification":">=99.5%; chromatography co-eluent (DCM:acetone 4:1) and TLC eluent (20% acetone/DCM)","hazard":"Highly flammable.","rawText":"DCM:acetone mixture, 4:1 (2 L)"},{"id":"m19","name":"Diethyl ether (Et2O), anhydrous","role":"solvent","molecularWeight":74.12,"casNumber":"60-29-7","smiles":"CCOCC","specification":">=99.5% / anhydrous; precipitation (100 mL) and wash (50 mL) of 3","hazard":"Extremely flammable; peroxide former.","rawText":"Slow addition of Et2O (100 mL) ... washed with Et2O (50 mL)"},{"id":"m20","name":"1,3,5-Trimethoxybenzene","role":"standard","molecularWeight":168.19,"casNumber":"621-23-8","smiles":"COc1cc(OC)cc(OC)c1","specification":"QNMR internal standard used to determine wt% purity of 1, 2 and 3","rawText":"purity by QNMR using 1,3,5-trimethoxybenzene as an internal standard"},{"id":"m21","name":"Dibenzo[b,d]thiophene-5-oxide (1) [isolated intermediate]","role":"reagent","molecularWeight":200.26,"casNumber":"1013-23-6","smiles":"O=S1c2ccccc2-c2ccccc21","specification":"Isolated in Step A (same compound as sample sp1); substrate / limiting reagent for the Step C coupling.","rawText":"dibenzo[b,d]thiophene 5-oxide 1 (5.0 g, 25.0 mmol, 1.0 equiv)","sourceReferences":[{"sourceId":"src1","page":260,"excerpt":"dibenzo[b,d]thiophene 5-oxide 1 (5.0 g, 25.0 mmol, 1.0 equiv)"}]},{"id":"m22","name":"Triisopropyl((trimethylsilyl)ethynyl)silane (2) [isolated intermediate]","role":"reagent","molecularWeight":254.56,"smiles":"C[Si](C)(C)C#C[Si](C(C)C)(C(C)C)C(C)C","specification":"Isolated in Step B (same compound as sample sp2); alkyne-transfer reagent, 1.0 equiv for the Step C coupling. CAS not confirmed.","rawText":"alkyne 2 (7.90 mL, 25.0 mmol, 1.0 equiv)","needsReview":true}],"equipment":[{"id":"e1","name":"100 mL two-necked round-bottomed flask","settings":"Thermocouple in one neck; 1.5 cm PTFE-coated oval stir bar; second neck open for addition (Step A)","rawText":"100 mL two-necked round-bottomed flask ... thermocouple ... 1.5 cm PTFE-coated oval stir bar"},{"id":"e2","name":"Syringe pump","settings":"Controlled dropwise addition: H2O2 over 2 h (Step A); Tf2O and alkyne 2 over 5 min each (Step C). Use PTFE tubing (no metal) for H2O2.","rawText":"added dropwise by syringe pump"},{"id":"e3","name":"Sintered glass frit (10 um pore)","settings":"Filtration of crude 1, of recrystallized 1, and of precipitated 3"},{"id":"e4","name":"250 mL three-necked round-bottomed flask (Schlenk)","settings":"N2 inlet (Schlenk line + bubbler), rubber septum, thermocouple; flame-dried for Step C","rawText":"three-necked, round-bottomed flask fitted with a nitrogen line, rubber septum and thermocouple"},{"id":"e5","name":"Cryogenic cooling bath / cryocooler","settings":"Isopropanol-dry ice bath to internal -70 C (Step B); cryocooler to -50 C (Step C)"},{"id":"e6","name":"Rotary evaporator","settings":"Step B: 40 C, 375 -> 75 mmHg. Step C: 40 C, 600 -> 375 mmHg (partial)."},{"id":"e7","name":"500 mL separatory funnel","settings":"Aqueous workup / phase separation (Step B)"},{"id":"e8","name":"Flash chromatography column","settings":"95 g silica, 16.0 x 6.0 cm, sand cap; eluent DCM (500 mL) then DCM:acetone 4:1 (2 L)"},{"id":"e9","name":"TLC plate + 254 nm UV lamp","settings":"Reaction monitoring (Steps A and C)"}],"samples":[{"id":"sp1","name":"Dibenzo[b,d]thiophene-5-oxide (1)","role":"intermediate","kind":"physical","derivedFromMaterialId":"m1","description":"Sulfoxide product of Step A (9.03 g, 81%, 97 wt%); isolated as material m21 and consumed as the substrate in Step C."},{"id":"sp2","name":"Triisopropyl((trimethylsilyl)ethynyl)silane (2)","role":"intermediate","kind":"physical","description":"Silylated alkyne product of Step B (7.42 g, 95%, 99 wt%); isolated as material m22 and consumed as the alkyne-transfer reagent in Step C."},{"id":"sp3","name":"5-(Triisopropylalkynyl)dibenzo[b,d]thiophenium triflate (3)","role":"output","kind":"physical","description":"Final electrophilic alkynylating reagent (7.50 g, 58%, 98 wt%); energetic solid, do not heat >100 C."}],"steps":[{"id":"s1","number":1,"phase":"A. Oxidation to sulfoxide 1","action":"Equip a 100 mL two-necked flask with a thermocouple and PTFE stir bar (second neck open). Charge dibenzo[b,d]thiophene, then add trifluoroacetic acid; a white suspension forms.","equipmentIds":["e1"],"materialUses":[{"materialId":"m1","amount":10,"unit":"g","equivalents":1,"limitingReagent":true,"role":"substrate (limiting reagent)","rawText":"Dibenzo[b,d]thiophene (10.00 g, 54.3 mmol, 1.00 equiv)"},{"materialId":"m2","amount":40,"unit":"mL","role":"reaction medium / acid","rawText":"trifluoroacetic acid (40.0 mL)"}],"parameters":[{"type":"mass","value":10,"unit":"g","formula":"n = m/M = 10.00 g / 184.26 g/mol = 54.3 mmol","rawText":"Dibenzo[b,d]thiophene (10.00 g, 54.3 mmol, 1.00 equiv)"},{"type":"amountOfSubstance","value":54.3,"unit":"mmol","formula":"n = m/M = 10.00 g / 184.26 g/mol","rawText":"54.3 mmol, 1.00 equiv","sourceReferences":[{"sourceId":"src1","page":258}]},{"type":"volume","value":40,"unit":"mL","rawText":"trifluoroacetic acid (40.0 mL)"}],"expectedResult":"White suspension of dibenzothiophene in TFA.","criticalNotes":"Use internal-temperature monitoring throughout; the subsequent peroxide addition is highly exothermic.","safetyNotes":"TFA is corrosive; work in a fume hood with gloves.","sourceReferences":[{"sourceId":"src1","page":258,"excerpt":"Dibenzo[b,d]thiophene (10.00 g, 54.3 mmol, 1.00 equiv)"}]},{"id":"s2","number":2,"phase":"A. Oxidation to sulfoxide 1","action":"Add 35% aqueous H2O2 dropwise by syringe pump through PTFE tubing (no metal contact) over 2 h, keeping the internal temperature below 30 C. A clear solution forms; stir 10 min, then confirm consumption of starting material by TLC.","equipmentIds":["e2","e9"],"materialUses":[{"materialId":"m3","amount":4.67,"unit":"mL","equivalents":1,"role":"oxidant","rawText":"35% w/w aqueous H2O2 (4.67 mL, 54.3 mmol, 1.00 equiv)"}],"parameters":[{"type":"volume","value":4.67,"unit":"mL","rawText":"H2O2 (4.67 mL, 54.3 mmol, 1.00 equiv)"},{"type":"amountOfSubstance","value":54.3,"unit":"mmol","formula":"n = (V x rho x wt%)/M = (4.67 mL x ~1.13 g/mL x 0.35)/34.01 g/mol = 54.3 mmol","rawText":"54.3 mmol, 1.00 equiv"},{"type":"time","value":2,"unit":"h","rawText":"over 2 h"},{"type":"time","value":25.7,"unit":"min","perUnit":"mL","formula":"controlled addition rate = 120 min / 4.67 mL = 25.7 min/mL","rawText":"added dropwise by syringe pump ... over 2 h"},{"type":"temperature","value":30,"comparator":"max","unit":"degC","rawText":"keeping the internal temperature below 30 C"},{"type":"time","value":10,"unit":"min","rawText":"stirred for an additional 10 min"}],"acceptanceCriteria":[{"parameter":"TLC monitoring (1:4 EtOAc/hexanes, UV 254 nm)","classification":"product (sulfoxide 1) Rf 0.05; starting pyrophoric and reacts violently with water; add under N2 with proper syringe technique."},{"id":"s7","number":7,"phase":"B. Synthesis of silyl alkyne 2","action":"Re-cool to internal -60 C, add TIPSCl over 5 min, then allow the clear solution to warm slowly to room temperature over 16 h.","equipmentIds":["e5"],"materialUses":[{"materialId":"m9","amount":6.55,"unit":"mL","equivalents":1,"limitingReagent":true,"role":"silylating agent (limiting reagent for Step B)","rawText":"TIPSCl (6.55 mL, 30.6 mmol, 1.0 equiv)"}],"parameters":[{"type":"temperature","value":-60,"comparator":"approx","unit":"degC","rawText":"cooled ... to an internal temperature of -60 C"},{"type":"volume","value":6.55,"unit":"mL","rawText":"TIPSCl (6.55 mL, 30.6 mmol, 1.0 equiv)"},{"type":"amountOfSubstance","value":30.6,"unit":"mmol","formula":"n = V x rho / M = 6.55 mL x ~0.901 g/mL / 192.80 g/mol = 30.6 mmol","rawText":"30.6 mmol, 1.0 equiv (limiting)"},{"type":"time","value":5,"unit":"min","rawText":"added over 5 min"},{"type":"time","value":16,"unit":"h","rawText":"warm up to room temperature over 16 h"}],"expectedResult":"Silylation complete after overnight warming.","sourceReferences":[{"sourceId":"src1","page":259}]},{"id":"s8","number":8,"phase":"B. Synthesis of silyl alkyne 2","pausePoint":true,"action":"Pour the mixture into a separatory funnel containing saturated aqueous NH4Cl; add MTBE to form a biphasic mixture and separate. Extract the aqueous phase twice more with MTBE, wash the combined organics with brine, dry over MgSO4, and concentrate under reduced pressure to give 2 as a colorless oil.","equipmentIds":["e7","e6"],"materialUses":[{"materialId":"m10","amount":150,"unit":"mL","role":"aqueous quench","rawText":"saturated aqueous ammonium chloride (150 mL)"},{"materialId":"m11","amount":50,"unit":"mL","role":"initial partition solvent","rawText":"MTBE (50 mL)"},{"materialId":"m11","amount":100,"unit":"mL","role":"extraction solvent (per extraction)","rawText":"extracted twice (MTB
