<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabRecord — Protocol Front-End Design Options</title>
<style>
/* LabRecord protocol renderer + demo shell styles */
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #1c2530;
  --muted: #5b6b7b;
  --line: #e3e8ee;
  --accent: #2f6f8f;
  --accent-soft: #e7f1f6;
  --review-bg: #fff4e5;
  --review-ink: #a15c00;
  --review-line: #f0c98a;
  --chip-bg: #eef2f6;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }

/* shell */
.app { display: flex; min-height: 100vh; }
.side { width: 280px; flex: 0 0 280px; background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-weight: 700; font-size: 18px; color: var(--accent); margin-bottom: 4px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 12px; }
.side h4 { margin: 18px 6px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; font: inherit; color: var(--ink); cursor: pointer; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item small { display: block; color: var(--muted); font-size: 11px; }
.nav-item.active small { color: #d7e7ef; }
.side-foot { margin-top: 18px; padding: 10px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.main { flex: 1; padding: 28px 34px; max-width: 1000px; }

/* protocol document */
.protocol { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 30px; }
.protocol h1 { font-size: 24px; margin: 0 0 10px; }
.protocol h2 { font-size: 16px; margin: 26px 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--accent-soft); color: var(--accent); }
.protocol h3.phase { font-size: 13px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.protocol p { margin: 6px 0; }
.protocol ul { margin: 6px 0; padding-left: 20px; }
.protocol li { margin: 3px 0; }
.protocol code { background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.protocol a { color: var(--accent); }

.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.badge { background: var(--chip-bg); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.badge-time { background: #eef6ee; color: #3a6b3a; }
.badge-review { background: var(--review-bg); color: var(--review-ink); }
.badge-status { background: #eae7fb; color: #4b3fa0; text-transform: capitalize; }
.badge-bsl { background: #fde8e8; color: #a23b3b; }

.tbl { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 14px; }
.tbl th { text-align: left; background: #f2f5f8; border: 1px solid var(--line); padding: 7px 9px; font-size: 12px; color: var(--muted); }
.tbl td { border: 1px solid var(--line); padding: 7px 9px; vertical-align: top; }
.tbl.proc td:first-child { width: 42px; text-align: center; color: var(--muted); }
.row-review { background: var(--review-bg); }

.param { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; margin: 2px 3px 2px 0; font-size: 12.5px; white-space: nowrap; }
.param-type { display: inline-block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 4px; vertical-align: 1px; }
.param-review { background: var(--review-bg); color: var(--review-ink); }
.chip { display: inline-block; background: var(--chip-bg); border-radius: 6px; padding: 1px 7px; margin: 2px 3px 0 0; font-size: 12px; }
.chip-review { background: var(--review-bg); color: var(--review-ink); }
.refs { margin-top: 5px; }
.opt { color: var(--muted); font-size: 12px; font-weight: 600; }
.decision { margin-top: 4px; font-size: 12.5px; color: #6a4bb0; }
.safety-inline { color: #a23b3b; font-size: 12.5px; }
.review { background: var(--review-bg); color: var(--review-ink); border: 1px solid var(--review-line); border-radius: 4px; font-size: 10px; padding: 0 4px; text-transform: uppercase; letter-spacing: .03em; }
.lic { color: var(--muted); font-size: 12px; }
.error { color: #a23b3b; }

.jsonbox { margin: 16px 0 0; }
.jsonbox summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
.jsonbox pre { background: #0f1720; color: #d7e2ec; padding: 14px; border-radius: 10px; overflow: auto; font-size: 12px; line-height: 1.45; max-height: 520px; }
.doc-note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin: 0 0 16px; font-size: 13.5px; color: #24506a; }
.schema-pre { background: #0f1720; color: #d7e2ec; padding: 16px; border-radius: 10px; overflow: auto; font-size: 12px; line-height: 1.45; }

/* Styles for the alternative protocol presentations (variants.js). Document view uses styles.css. */
.v-head { margin-bottom: 14px; }
.v-head h1 { font-size: 22px; margin: 0 0 8px; }
.v-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.v-badge { background: #eef2f6; color: #5b6b7b; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.v-badge-time { background: #eef6ee; color: #3a6b3a; }
.v-purpose { color: #33414f; margin: 0; }
.v-pill { display: inline-block; background: #e7f1f6; color: #2f6f8f; border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12.5px; white-space: nowrap; }
.v-pill i { font-style: normal; font-size: 9.5px; text-transform: uppercase; color: #86a2b1; margin-right: 4px; }
.v-pill-review { background: #fff4e5; color: #a15c00; }
.v-chip { display: inline-block; background: #eef2f6; border-radius: 6px; padding: 1px 8px; margin: 2px 4px 0 0; font-size: 12px; color: #33414f; }
.v-chip-eq { background: #f0ecfb; color: #5b4b9f; }
.v-chip-sw { background: #e6f4f0; color: #2b7a5f; }
.v-chip-in { background: #e8f0fe; color: #3367d6; }
.v-chip-out { background: #e6f9e8; color: #2e7d32; }
.v-chip-tbl { background: #fef3e0; color: #8a6d3b; }
.v-chip-review { background: #fff4e5; color: #a15c00; }
.v-row { margin-top: 5px; }
.v-row-dim { opacity: .9; }
.v-opt { color: #86a2b1; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.v-flag { background: #fff4e5; color: #a15c00; font-size: 10px; padding: 0 4px; border-radius: 3px; }
.v-expect { color: #3a6b3a; font-size: 13px; margin-top: 5px; }
.v-note { color: #8a5a1a; font-size: 12.5px; margin-top: 3px; }

/* --- checklist / bench run-mode --- */
.v-checklist .v-phase-bar { background: #2f6f8f; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; margin: 18px 0 8px; }
.v-card { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid #e3e8ee; border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; transition: box-shadow .15s; }
.v-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.v-card-review { border-left: 3px solid #f0c98a; }
.v-check { margin-top: 4px; width: 18px; height: 18px; flex: 0 0 auto; }
.v-card:has(.v-check:checked) { opacity: .55; background: #f6f8fa; }
.v-card:has(.v-check:checked) .v-card-top { text-decoration: line-through; }
.v-card-body { flex: 1; }
.v-card-top { font-size: 15px; }
.v-num { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; background: #e7f1f6; color: #2f6f8f; border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 8px; }

/* --- timeline / vertical stepper --- */
.v-tl { position: relative; margin-left: 12px; padding-left: 26px; border-left: 2px solid #dbe3ea; }
.v-tl-phase { margin: 16px 0 10px -40px; }
.v-tl-phase span { background: #eef2f6; color: #33414f; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 4px 12px; border-radius: 999px; }
.v-tl-item { position: relative; margin: 0 0 16px; }
.v-tl-dot { position: absolute; left: -37px; top: 0; width: 24px; height: 24px; line-height: 24px; text-align: center; background: #2f6f8f; color: #fff; border-radius: 50%; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 4px #fff; }
.v-tl-review .v-tl-dot { background: #d98a2b; }
.v-tl-content { background: #fff; border: 1px solid #e3e8ee; border-radius: 10px; padding: 10px 14px; }
.v-tl-action { font-size: 14.5px; }

/* --- compact / two-column reference --- */
.v-compact .v-cols { display: flex; gap: 22px; align-items: flex-start; }
.v-side { flex: 0 0 240px; background: #f6f8fa; border: 1px solid #e3e8ee; border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.v-side h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #5b6b7b; }
.v-side h4:first-child { margin-top: 0; }
.v-mini { margin: 0; padding-left: 16px; }
.v-mini li { margin: 2px 0; }
.v-main { flex: 1; }
.v-cphase { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #2f6f8f; }
.v-steps { margin: 0 0 8px; padding-left: 26px; }
.v-steps li { margin: 5px 0; font-size: 13.5px; }
.v-li-review { background: #fff8ef; }
.v-expect-inline { color: #3a6b3a; }

/* --- v0.3 elements shared across variants --- */
.v-badge-disc { background: #e6f4f0; color: #2b7a5f; }
.v-repeat { display: inline-block; background: #f0ecfb; color: #5b4b9f; border-radius: 6px; padding: 1px 7px; margin-left: 6px; font-size: 11px; font-weight: 600; }
.v-cmd { margin-top: 5px; }
.v-cmd code { display: inline-block; background: #0f1720; color: #d7e2ec; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; max-width: 100%; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.v-cmd-inline { background: #0f1720; color: #d7e2ec; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
.v-accept { color: #2f6f8f; font-size: 12.5px; margin-top: 3px; }
.v-accept-inline { color: #2f6f8f; font-size: 12px; }
.v-flow { margin-top: 5px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.v-flow-inline { display: inline; }
.v-arrow { color: #5b6b7b; font-weight: 700; font-size: 14px; }
.v-branch { margin-top: 4px; font-size: 12.5px; color: #6a4bb0; }
.v-section { margin: 12px 0 14px; padding: 10px 14px; background: #f6f8fa; border: 1px solid #e3e8ee; border-radius: 10px; }
.v-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #5b6b7b; margin-bottom: 6px; }
.v-tbl { width: 100%; border-collapse: collapse; margin: 4px 0; font-size: 12.5px; }
.v-tbl th { text-align: left; background: #eef2f6; border: 1px solid #e3e8ee; padding: 4px 8px; font-size: 11px; color: #5b6b7b; }
.v-tbl td { border: 1px solid #e3e8ee; padding: 4px 8px; }
.v-detail { font-size: 12.5px; color: #33414f; margin: 3px 0; }
.v-side .v-detail { font-size: 11.5px; color: #5b6b7b; margin: 2px 0 4px; }

/* toolbar for the comparison page */
.vtoolbar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #e3e8ee; padding: 12px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.vtoolbar .grp { display: flex; gap: 6px; align-items: center; }
.vtoolbar label { font-size: 12px; color: #5b6b7b; font-weight: 600; }
.vtoolbar select { font: inherit; padding: 5px 8px; border: 1px solid #cdd6df; border-radius: 8px; background: #fff; }
.vseg { display: inline-flex; border: 1px solid #cdd6df; border-radius: 8px; overflow: hidden; }
.vseg button { border: 0; background: #fff; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: #33414f; }
.vseg button.active { background: #2f6f8f; color: #fff; }
.vseg button + button { border-left: 1px solid #cdd6df; }
.vwrap { padding: 22px 26px; max-width: 940px; margin: 0 auto; }
.vhint { color: #5b6b7b; font-size: 12.5px; margin: 0 0 14px; }
@media print { .vtoolbar { display: none; } }

body { background: #f6f7f9; }
</style>
</head>
<body>
<div class="vtoolbar">
  <div class="grp"><strong style="color:#2f6f8f">LabRecord</strong><span style="color:#5b6b7b;font-size:13px">Front-end design options</span></div>
  <div class="grp"><label for="psel">Protocol</label>
    <select id="psel"><option value="0">Western Blot</option><option value="1">RT-qPCR (MIQE)</option><option value="2">Cell Culture</option><option value="3">Gel Filtration</option><option value="4">Protein Concentration</option></select>
  </div>
  <div class="grp"><label>Design</label>
    <span class="vseg" id="seg"><button data-key="document" class="active">Document</button><button data-key="checklist">Checklist / Run</button><button data-key="timeline">Timeline</button><button data-key="compact">Compact / Print</button></span>
  </div>
</div>
<div class="vwrap">
  <p class="vhint" id="hint"></p>
  <div id="view"></div>
</div>

<script>
/*
 * LabRecord canonical-protocol renderer (framework-agnostic).
 * renderProtocolHTML(protocol) -> HTML string in the LabRecord Protocol Format v0.1 layout.
 * Works in the browser (sets window.renderProtocolHTML) and in Node (module.exports).
 * Pure function: no DOM, no network. Input must conform to canonical-schema.json.
 */
(function (global) {
  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function reviewMark(needs) {
    return needs ? ' <span class="review" title="Needs human review">needs review</span>' : "";
  }

  // Format one structured parameter into a readable chip.
  function fmtParam(p) {
    var text = p.rawText;
    if (!text) {
      if (p.value !== null && p.value !== undefined) {
        text = String(p.value);
        if (p.valueMax !== null && p.valueMax !== undefined && p.valueMax !== p.value) {
          text += "–" + p.valueMax; // en dash
        }
        if (p.unit) text += " " + p.unit;
      } else if (p.unit) {
        text = p.unit;
      } else {
        text = p.type || "";
      }
    }
    var cls = "param" + (p.needsReview ? " param-review" : "");
    return '<span class="' + cls + '"><span class="param-type">' + esc(p.type) + "</span>" + esc(text) + "</span>";
  }

  function refChip(name, needs) {
    return '<span class="chip' + (needs ? " chip-review" : "") + '">' + esc(name) + "</span>";
  }

  function renderProtocolHTML(protocol) {
    if (!protocol || !protocol.metadata) {
      return '<article class="protocol"><p class="error">Invalid protocol object.</p></article>';
    }
    var m = protocol.metadata;
    var matById = {};
    (protocol.materials || []).forEach(function (x) { matById[x.id] = x; });
    var eqById = {};
    (protocol.equipment || []).forEach(function (x) { eqById[x.id] = x; });

    // count needsReview items for the summary badge
    var reviewCount = 0;
    (protocol.materials || []).forEach(function (x) { if (x.needsReview) reviewCount++; });
    (protocol.equipment || []).forEach(function (x) { if (x.needsReview) reviewCount++; });
    (protocol.steps || []).forEach(function (x) {
      if (x.needsReview) reviewCount++;
      (x.parameters || []).forEach(function (p) { if (p.needsReview) reviewCount++; });
    });

    var h = [];
    h.push('<article class="protocol">');

    // ---- Header ----
    h.push('<header class="p-head">');
    h.push("<h1>" + esc(m.title) + "</h1>");
    h.push('<div class="badges">');
    if (m.family) h.push('<span class="badge">' + esc(m.family) + "</span>");
    if (m.category) h.push('<span class="badge">' + esc(m.category) + "</span>");
    if (m.version) h.push('<span class="badge">v' + esc(m.version) + "</span>");
    if (m.estimatedTime) h.push('<span class="badge badge-time">⏱ ' + esc(m.estimatedTime) + "</span>");
    if (reviewCount > 0) h.push('<span class="badge badge-review">' + reviewCount + " need review</span>");
    if (protocol.provenance && protocol.provenance.status) {
      h.push('<span class="badge badge-status">' + esc(protocol.provenance.status) + "</span>");
    }
    h.push("</div>");
    if (m.purpose) h.push("<p><strong>Purpose:</strong> " + esc(m.purpose) + "</p>");
    if (m.scope) h.push("<p><strong>Scope / Applicability:</strong> " + esc(m.scope) + "</p>");
    if (m.beforeYouBegin && m.beforeYouBegin.length) {
      h.push("<p><strong>Before You Begin:</strong></p><ul>");
      m.beforeYouBegin.forEach(function (b) { h.push("<li>" + esc(b) + "</li>"); });
      h.push("</ul>");
    }
    h.push("</header>");

    // ---- Materials ----
    if (protocol.materials && protocol.materials.length) {
      h.push("<h2>Materials and Reagents</h2>");
      h.push('<table class="tbl"><thead><tr><th>Name</th><th>Amount / Working conc.</th><th>Specification / Grade</th><th>Vendor / Cat#</th></tr></thead><tbody>');
      protocol.materials.forEach(function (x) {
        var amt = "";
        if (x.amount !== null && x.amount !== undefined) {
          amt = String(x.amount);
          if (x.amountMax !== null && x.amountMax !== undefined && x.amountMax !== x.amount) amt += "–" + x.amountMax;
          if (x.unit) amt += " " + x.unit;
        } else if (x.workingConcentration) {
          amt = x.workingConcentration;
        }
        var vendor = x.vendor || "";
        if (x.catalogNumber) vendor += (vendor ? " " : "") + x.catalogNumber;
        h.push("<tr" + (x.needsReview ? ' class="row-review"' : "") + "><td>" + esc(x.name) + reviewMark(x.needsReview) +
          "</td><td>" + esc(amt) + "</td><td>" + esc(x.specification || "") + "</td><td>" + esc(vendor) + "</td></tr>");
      });
      h.push("</tbody></table>");
    }

    // ---- Equipment ----
    if (protocol.equipment && protocol.equipment.length) {
      h.push("<h2>Equipment and Settings</h2>");
      h.push('<table class="tbl"><thead><tr><th>Name</th><th>Model</th><th>Settings</th></tr></thead><tbody>');
      protocol.equipment.forEach(function (x) {
        h.push("<tr" + (x.needsReview ? ' class="row-review"' : "") + "><td>" + esc(x.name) + reviewMark(x.needsReview) +
          "</td><td>" + esc(x.model || "") + "</td><td>" + esc(x.settings || "") + "</td></tr>");
      });
      h.push("</tbody></table>");
    }

    // ---- Procedure (grouped by phase, in first-appearance order) ----
    if (protocol.steps && protocol.steps.length) {
      h.push("<h2>Procedure</h2>");
      var order = [];
      var groups = {};
      protocol.steps.forEach(function (s) {
        var key = s.phase || "";
        if (!(key in groups)) { groups[key] = []; order.push(key); }
        groups[key].push(s);
      });
      order.forEach(function (key) {
        if (key) h.push('<h3 class="phase">' + esc(key) + "</h3>");
        h.push('<table class="tbl proc"><thead><tr><th>Step</th><th>Action</th><th>Parameters</th><th>Expected Result / QC</th><th>Critical Notes</th></tr></thead><tbody>');
        groups[key].forEach(function (s) {
          var refs = [];
          (s.materialIds || []).forEach(function (id) { if (matById[id]) refs.push(refChip(matById[id].name, matById[id].needsReview)); });
          (s.equipmentIds || []).forEach(function (id) { if (eqById[id]) refs.push(refChip(eqById[id].name, eqById[id].needsReview)); });
          var params = (s.parameters || []).map(fmtParam).join(" ");
          var action = esc(s.action);
          if (s.optional) action = '<span class="opt">[optional]</span> ' + action;
          if (s.decisionPoint) action += '<div class="decision">⎇ ' + esc(s.decisionPoint) + "</div>";
          if (refs.length) action += '<div class="refs">' + refs.join(" ") + "</div>";
          var notes = esc(s.criticalNotes || "");
          if (s.safetyNotes) notes += (notes ? "<br>" : "") + '<span class="safety-inline">⚠ ' + esc(s.safetyNotes) + "</span>";
          h.push("<tr" + (s.needsReview ? ' class="row-review"' : "") + "><td>" + esc(s.number !== undefined && s.number !== null ? s.number : "") + reviewMark(s.needsReview) +
            "</td><td>" + action + "</td><td>" + params + "</td><td>" + esc(s.expectedResult || "") + "</td><td>" + notes + "</td></tr>");
        });
        h.push("</tbody></table>");
      });
    }

    // ---- Controls ----
    if (protocol.controls && protocol.controls.length) {
      h.push("<h2>Controls</h2><ul>");
      protocol.controls.forEach(function (c) {
        h.push("<li><strong>" + esc(c.name) + "</strong>" + (c.description ? ": " + esc(c.description) : "") + reviewMark(c.needsReview) + "</li>");
      });
      h.push("</ul>");
    }

    // ---- Expected Outputs ----
    if (protocol.expectedOutputs && protocol.expectedOutputs.length) {
      h.push("<h2>Expected Outputs</h2><ul>");
      protocol.expectedOutputs.forEach(function (o) { h.push("<li>" + esc(o) + "</li>"); });
      h.push("</ul>");
    }

    // ---- Troubleshooting ----

<script>
/*
 * Alternative front-end presentations of the SAME canonical protocol JSON.
 * window.renderVariant(protocol, style) -> HTML string. Styles:
 *   "document" (journal layout, via renderer.js), "checklist" (bench run-mode cards),
 *   "timeline" (vertical stepper), "compact" (two-column print/reference).
 * Same data, different presentation — for design review.
 * Supports v0.1/v0.2/v0.3 fields.
 */
(function (global) {
  function esc(s) {

  }
  function fmtParam(p) {
    var t = p.rawText;
    if (!t) {
      if (p.valueText) t = p.valueText;
      else if (p.value !== null && p.value !== undefined) {
        var pre = p.comparator === "min" ? "≥ " : p.comparator === "max" ? "≤ " : p.comparator === "approx" ? "~ " : "";
        t = pre + p.value;
        if (p.valueMax !== null && p.valueMax !== undefined && p.valueMax !== p.value) t += "–" + p.valueMax;
        if (p.unit) t += " " + p.unit;

  }
  function lookups(p) {
    var m = {}, e = {}, sw = {}, sp = {}, tbl = {};
    (p.materials || []).forEach(function (x) { m[x.id] = x; });
    (p.equipment || []).forEach(function (x) { e[x.id] = x; });
    (p.software || []).forEach(function (x) { sw[x.id] = x; });
    (p.samples || []).forEach(function (x) { sp[x.id] = x; });

  }
  function nmeOf(id, L) {

  }
  function refChips(s, L) {
    var out = [];
    if (s.materialUses && s.materialUses.length) {
      s.materialUses.forEach(function (u) {
        var lbl = (L.m[u.materialId] ? L.m[u.materialId].name : u.materialId);

    } else {
      (s.materialIds || []).forEach(function (id) { if (L.m[id]) out.push('<span class="v-chip' + (L.m[id].needsReview ? " v-chip-review" : "") + '">' + esc(L.m[id].name) + "</span>"); });
    }
    (s.equipmentIds || []).forEach(function (id) { if (L.e[id]) out.push('<span class="v-chip v-chip-eq">' + esc(L.e[id].name) + "</span>"); });
    (s.softwareIds || []).forEach(function (id) { if (L.sw[id]) out.push('<span class="v-chip v-chip-sw">' + esc(L.sw[id].name) + "</span>"); });
    (s.containerIds || []).forEach(function (id) { out.push('<span class="v-chip v-chip-eq">' + esc(id) + "</span>"); });
    (s.tableIds || []).forEach(function (id) { out.push('<span class="v-chip v-chip-tbl">' + esc((L.tbl[id] && L.tbl[id].title) || id) + "</span>"); });

  }
  function byPhase(p) {

  function head(p, sub) {

    var badges = [];
    if (m.discipline) badges.push('<span class="v-badge v-badge-disc">' + esc(m.discipline) + "</span>");
    if (m.family) badges.push('<span class="v-badge">' + esc(m.family) + "</span>");
    if (m.estimatedTime) badges.push('<span class="v-badge v-badge-time">⏱ ' + esc(m.estimatedTime) + "</span>");
    return '<div class="v-head"><h1>' + esc(m.title) + '</h1><div class="v-badges">' + badges.join("") +
      '</div><p class="v-purpose">' + esc(m.purpose) + "</p>" + (sub || "") + "</div>";
  }
  function flowLine(s, L) {
    if ((!s.inputIds || !s.inputIds.length) && (!s.outputIds || !s.outputIds.length)) return "";
    var fl = '<div class="v-flow">';
    if (s.inputIds && s.inputIds.length) fl += s.inputIds.map(function (id) { return '<span class="v-chip v-chip-in">' + esc(nmeOf(id, L)) + "</span>"; }).join(" ");
    fl += ' <span class="v-arrow">→</span> ';
    if (s.outputIds && s.outputIds.length) fl += s.outputIds.map(function (id) { return '<span class="v-chip v-chip-out">' + esc(nmeOf(id, L)) + "</span>"; }).join(" ");
    return fl + "</div>";
  }
  function repeatBadge(s) {
    if (!s.repeat) return "";
    var r = s.repeat.count ? "↺×" + s.repeat.count : (s.repeat.untilCondition ? "↺ until " + s.repeat.untilCondition : "↺ repeat");
    if (s.repeat.over) r += " (" + s.repeat.over + ")";
    return '<span class="v-repeat">' + esc(r) + "</span>";
  }
  function cmdBlock(s) {
    if (!s.command) return "";
    return '<div class="v-cmd"><code>' + esc(s.command) + "</code></div>";
  }
  function acceptBlock(s) {
    if (!s.acceptanceCriteria || !s.acceptanceCriteria.length) return "";
    var out = [];
    s.acceptanceCriteria.forEach(function (a) {
      var line = "✓ " + esc(a.parameter || a.description || "acceptance");
      if (a.value !== undefined && a.value !== null) {
        var pre = a.comparator === "min" ? "≥ " : a.comparator === "max" ? "≤ " : "";

    });

  }
  function branchLines(s) {
    if (!s.branches || !s.branches.length) return "";
    var out = [];
    s.branches.forEach(function (b) {
      out.push('<div class="v-branch">⎋ ' + esc(b.condition) + (b.targetStepId ? " → " + esc(b.targetStepId) : "") + (b.action ? ": " + esc(b.action) : "") + "</div>");
    });
    return out.join("");
  }
  function studyDesignSection(p) {
    var sd = p.studyDesign;
    if (!sd || (!sd.groups && !sd.randomization && !sd.blinding && !sd.statisticalPlan && !(sd.timepoints && sd.timepoints.length))) return "";
    var h = [];
    h.push('<div class="v-section"><div class="v-section-title">Study Design</div>');

      h.push('<table class="v-tbl"><thead><tr><th>Group</th><th>N</th><th>Treatment</th></tr></thead><tbody>');

      h.push("</tbody></table>");
    }
    if (sd.randomization) h.push('<div class="v-detail"><b>Randomization:</b> ' + esc(sd.randomization) + "</div>");

    h.push("</div>");
    return h.join("");
  }
  function complianceSection(p) {
    var cp = p.compliance;
    if (!cp || (!cp.iacuc && !cp.irb && !cp.approvalId && !cp.consent && !cp.wasteDisposal)) return "";

    h.push('<div class="v-section"><div class="v-section-title">Compliance & Ethics</div>');
    if (cp.iacuc) h.push('<div class="v-detail"><b>IACUC:</b> ' + esc(cp.iacuc) + "</div>");
    if (cp.irb) h.push('<div class="v-detail"><b>IRB:</b> ' + esc(cp.irb) + "</div>");
    if (cp.approvalId) h.push('<div class="v-detail"><b>Approval:</b> ' + esc(cp.approvalId) + "</div>");
    if (cp.consent) h.push('<div class="v-detail"><b>Consent:</b> ' + esc(cp.consent) + "</div>");
    if (cp.wasteDisposal) h.push('<div class="v-detail"><b>Waste disposal:</b> ' + esc(cp.wasteDisposal) + "</div>");
    h.push("</div>");
    return h.join("");
  }

  // ---- checklist / bench run-mode ----
  function renderChecklist(p) {
    var L = lookups(p), ph = byPhase(p), h = [];

    h.push(head(p));
    h.push(studyDesignSection(p));
    h.push(complianceSection(p));
    ph.order.forEach(function (key) {
      if (key) h.push('<div class="v-phase-bar">' + esc(key) + "</div>");

        var params = (s.parameters || []).map(fmtParam).join(" ");
        var refs = refChips(s, L);
        h.push('<label class="v-card' + (s.needsReview ? " v-card-review" : "") + '">');
        h.push('<input type="checkbox" class="v-check">');
        h.push('<div class="v-card-body">');
        h.push('<div class="v-card-top"><span class="v-num">' + esc(s.number || "") + "</span>" +
          (s.optional ? '<span class="v-opt">optional</span> ' : "") + esc(s.action) +
          repeatBadge(s) + "</div>");
        if (params) h.push('<div class="v-row">' + params + "</div>");
        if (refs) h.push('<div class="v-row">' + refs + "</div>");
        h.push(flowLine(s, L));
        h.push(cmdBlock(s));
        h.push(branchLines(s));
        if (s.expectedResult) h.push('<div class="v-expect">✓ ' + esc(s.expectedResult) + "</div>");
        h.push(acceptBlock(s));
        if (s.criticalNotes) h.push('<div class="v-note">! ' + esc(s.criticalNotes) + "</div>");
        h.push("</div></label>");
      });
    });
    h.push("</div>");
    return h.join("");
  }

  // ---- timeline / vertical stepper ----
  function renderTimeline(p) {
    var L = lookups(p), ph = byPhase(p), h = [];
    h.push('<div class="v-timeline">');
    h.push(head(p));
    h.push(studyDesignSection(p));
    h.push(complianceSection(p));
    h.push('<div class="v-tl">');
    ph.order.forEach(function (key) {
      if (key) h.push('<div class="v-tl-phase"><span>' + esc(key) + "</span></div>");
      ph.g[key].forEach(function (s) {
        var params = (s.parameters || []).map(fmtParam).join(" ");
        var refs = refChips(s, L);
        h.push('<div class="v-tl-item' + (s.needsReview ? " v-tl-review" : "") + '">');
        h.push('<div class="v-tl-dot">' + esc(s.number || "") + "</div>");
        h.push('<div class="v-tl-content"><div class="v-tl-action">' +
          (s.optional ? '<span class="v-opt">optional</span> ' : "") + esc(s.action) +
          repeatBadge(s) + "</div>");
        if (params) h.push('<div class="v-row">' + params + "</div>");
        if (refs) h.push('<div class="v-row v-row-dim">' + refs + "</div>");
        h.push(flowLine(s, L));
        h.push(cmdBlock(s));
        h.push(branchLines(s));
        if (s.expectedResult) h.push('<div class="v-expect">✓ ' + esc(s.expectedResult) + "</div>");
        h.push(acceptBlock(s));
        if (s.criticalNotes) h.push('<div class="v-note">! ' + esc(s.criticalNotes) + "</div>");
        h.push("</div></div>");
      });
    });

  }

      h.push("</ul>");

      h.push("<h4>Compliance</h4><ul class=\"v-mini\">");

        if ((s.inputIds && s.inputIds.length) || (s.outputIds && s.outputIds.length)) {
          var fl = ' <span class="v-flow-inline">';

          fl += ' → ';
          if (s.outputIds && s.outputIds.length) fl += s.outputIds.map(function (id) { return '<span class="v-chip v-chip-out">' + esc(nmeOf(id, L)) + "</span>"; }).join(" ");
          extra += fl + "</span>";
        }
        var acc = "";
        (s.acceptanceCriteria || []).forEach(function (a) {
          var pre = a.comparator === "min" ? "≥ " : a.comparator === "max" ? "≤ " : "";
          acc += ' <span class="v-accept-inline">✓ ' + esc(a.parameter || a.description || "") +
            (a.value !== undefined && a.value !== null ? ": " + pre + a.value + (a.unit ? " " + a.unit : "") : "") + "</span>";
        });
        h.push('<li value="' + esc(s.number || "") + '"' + (s.needsReview ? ' class="v-li-review"' : "") + ">" +
          (s.optional ? '<span class="v-opt">optional</span> ' : "") + esc(s.action) + extra +
          (params ? ' ' + params : "") +
          (s.expectedResult ? ' <span class="v-expect-inline">→ ' + esc(s.expectedResult) + "</span>" : "") +
          acc +
          "</li>");
      });
      h.push("</ol>");
    });
    h.push("</main></div></div>");

  function renderVariant(protocol, style) {
    if (!protocol || !protocol.metadata) return '<p class="error">Invalid protocol.</p>';

    if (style === "timeline") return renderTimeline(protocol);
    if (style === "compact") return renderCompact(protocol);

    if (typeof global.renderProtocolHTML === "function") return global.renderProtocolHTML(protocol);
    return '<p class="error">document renderer not loaded.</p>';
  }

  global.renderVariant = renderVariant;
  if (typeof module !== "undefined" && module.exports) module.exports = { renderVariant: renderVariant };
})(typeof window !== "undefined" ? window : globalThis);
