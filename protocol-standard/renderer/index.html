<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabRecord — Protocol Standard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.sidebar{width:230px;background:#1a2638;color:#c8d6e5;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:20px 20px 24px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-name{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:#6b8299;margin-top:2px}
nav{padding:12px 0;flex:1}
.nav-label{padding:20px 20px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#4a6070;font-weight:700}
nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#8a9fb5;text-decoration:none;font-size:13.5px;transition:all .15s;border-left:3px solid transparent}
nav a:hover{color:#d4e0ec;background:rgba(255,255,255,.04)}
nav a.active{color:#fff;background:rgba(255,255,255,.08);border-left-color:#4a9ece}
nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.6}
nav a.active svg{opacity:1}
.footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#4a6070}
.content{flex:1;overflow:hidden}
.content iframe{width:100%;height:100%;border:none;display:block}
@media(max-width:768px){
  .sidebar{width:56px}
  .brand-name,.brand-sub,nav a span,.nav-label,.footer{display:none}
  .brand{padding:14px 12px}
  nav a{justify-content:center;padding:12px 0;border-left:none}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">LabRecord</div>
    <div class="brand-sub">Protocol Standard</div>
  </div>
  <div class="nav-label">Documentation</div>
  <nav>
    <a href="#" data-page="schema.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Schema Architecture</span>
    </a>
    <a href="#" data-page="viewer.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      <span>Protocol Viewer</span>
    </a>
  </nav>
  <div class="footer">v0.4 Golden Standard</div>
</aside>
<main class="content">
  <iframe id="frame" src="schema.html"></iframe>
</main>
<script>
(function(){
  var links=document.querySelectorAll('[data-page]');
  var frame=document.getElementById('frame');
  links.forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      frame.src=a.getAttribute('data-page');
      links.forEach(function(x){x.classList.remove('active')});
      a.classList.add('active');
    });
  });
  var params=new URLSearchParams(window.location.search);
  var p=params.get('page');
  if(p){
    links.forEach(function(a){
      if(a.getAttribute('data-page')===p){
        a.click();
      }
    });
  }
})();
</script>
</body>
</html>
